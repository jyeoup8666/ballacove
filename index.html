<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ballacove</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Jua&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Pen+Script&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<style>
/* 기본 리셋: 단독 실행 시에도 hidden 속성이 항상 숨김으로 동작하도록 */
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
.hint .btn{pointer-events:auto}

/* 레이아웃: 왼쪽 내비 + 작업 영역. Cove Map은 점 격자 캔버스 위에 카드와 연결선. 강조색은 만(cove)의 깊은 청록 하나, 카드 종류색은 의미 표시용. */
:root{
  --bg:#EDF1F0; --surface:#FBFCFC; --sunk:#E2E8E7; --ink:#14201E; --muted:#56635F; --line:#CBD5D3; --dot:#BFCAC8;
  --accent:#0D6B66; --accent-ink:#F2FAF9; --accent-soft:#D2E7E4;
  --k-idea:#9A6410; --k-intro:#B54A26; --k-ref:#2C5AA0; --k-scene:#0D6B66; --k-feedback:#74469E; --k-memo:#5F6B69;
  --wire:#8A9794; --film:#141B1A; --pen-ink:#1B2422; --pen-red:#D2453A; --pen-blue:#2F66C8; --pen-green:#2A8A55;
  --ok:#2A7A4B; --warn:#9A6410; --bad:#B03535;
  --shadow:0 1px 2px rgba(20,32,30,.07),0 6px 18px rgba(20,32,30,.07);
  --f-display:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1716; --surface:#17211F; --sunk:#0B1211; --ink:#E3EBE9; --muted:#97A6A3; --line:#2B3A37; --dot:#26332F;
  --accent:#55B8AE; --accent-ink:#062220; --accent-soft:#173C38;
  --k-idea:#E2AA4C; --k-intro:#EC8661; --k-ref:#86A8E2; --k-scene:#55B8AE; --k-feedback:#BC98DC; --k-memo:#9CA8A6; --wire:#5F6E6B; --pen-ink:#E3EBE9; --pen-red:#F07A6E; --pen-blue:#7FA8F0; --pen-green:#6CCB93;
  --ok:#5FC28C; --warn:#E2AA4C; --bad:#E57373; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1716; --surface:#17211F; --sunk:#0B1211; --ink:#E3EBE9; --muted:#97A6A3; --line:#2B3A37; --dot:#26332F;
  --accent:#55B8AE; --accent-ink:#062220; --accent-soft:#173C38;
  --k-idea:#E2AA4C; --k-intro:#EC8661; --k-ref:#86A8E2; --k-scene:#55B8AE; --k-feedback:#BC98DC; --k-memo:#9CA8A6; --wire:#5F6E6B; --pen-ink:#E3EBE9; --pen-red:#F07A6E; --pen-blue:#7FA8F0; --pen-green:#6CCB93;
  --ok:#5FC28C; --warn:#E2AA4C; --bad:#E57373; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:12.5px}

#app{display:grid;grid-template-columns:224px minmax(0,1fr);height:100%}
.side{border-right:1px solid var(--line);padding-block:20px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:22px;overflow:auto}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em;padding-inline:8px}
.brand svg{width:26px;height:26px}
.navlist{display:flex;flex-direction:column;gap:2px}
.navbtn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:0;background:none;color:var(--muted);font-weight:500;cursor:pointer;text-align:left}
.navbtn:hover{background:var(--sunk);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.navbtn svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.badge{margin-left:auto;background:var(--accent);color:var(--accent-ink);font-size:11px;font-family:var(--f-mono);padding:0 7px;border-radius:99px;line-height:18px}
.plan{margin-top:auto;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding:14px 8px 0;display:grid;gap:7px}
.plan b{color:var(--ink);font-weight:600}
.meter{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}.meter>i{display:block;height:100%;background:var(--accent)}
.planrow{display:flex;justify-content:space-between;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tabbar{display:none}
main{min-width:0;min-height:0;overflow:auto;position:relative}

.page{max-width:1060px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px;align-content:start}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:27px;line-height:1.25;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:16.5px;margin:0;letter-spacing:-.01em}
h3{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.04em;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:14px;align-content:start;min-width:0}
.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap;border:0;line-height:1.5}
button.chip{cursor:pointer}
.kchip{color:var(--k);background:color-mix(in srgb,var(--k) 13%,transparent);font-weight:600}
.k-idea{--k:var(--k-idea)}.k-intro{--k:var(--k-intro)}.k-ref{--k:var(--k-ref)}.k-scene{--k:var(--k-scene)}.k-feedback{--k:var(--k-feedback)}.k-memo{--k:var(--k-memo)}
.st-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.st-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.st-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* 작업 홈 */
.continue{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:20px;align-items:center}
.continue h2{font-size:22px;font-weight:800}
.continue .lede{margin:0;color:var(--muted);max-width:52ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.mini{width:100%;height:auto;display:block;background:var(--bg);border-radius:8px;border:1px solid var(--line)}
.rows{display:grid}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0;padding-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row button.t{border:0;background:none;padding:0;cursor:pointer;text-align:left;max-width:100%}
.row button.t:hover{color:var(--accent)}
.bar{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:5px;max-width:240px}.bar i{display:block;height:100%;background:var(--accent)}
.act{font-size:13px}.act time{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.metric{display:grid;gap:2px}.metric span{font-size:12px;color:var(--muted)}.metric b{font-family:var(--f-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.metric b.na{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:400}
.perf{display:grid;gap:12px;padding-top:14px;border-top:1px solid var(--line)}
.perf:first-of-type{border-top:0;padding-top:0}
.empty{display:grid;justify-items:start;gap:10px;padding:28px}

/* 프로젝트 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 12px;color:var(--muted);font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .mono{font-size:12px;margin-left:4px}
.plist{display:grid;gap:10px}
.prow{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;flex-wrap:wrap}
.prow-main{flex:1 1 260px;min-width:0;display:flex;gap:14px;align-items:center;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.prow-main .mini{width:96px;flex:none}
.prow-main:hover h3{color:var(--accent)}
.prow h3{font-size:15.5px;font-weight:600;margin-bottom:4px}
.prow-acts{display:flex;gap:6px;flex-wrap:wrap}
.trashlink{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Cove Map */
.mapview{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.maptop{display:flex;align-items:center;gap:8px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.maptitle{font-family:var(--f-display);font-weight:700;font-size:16.5px;border:1px solid transparent;background:none;min-width:0;flex:1 1 150px;padding:4px 8px;border-radius:6px}
.maptitle:hover:not([readonly]),.maptitle:focus{border-color:var(--line);background:var(--bg)}
.savestate{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.savestate i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.savestate.saving i{background:var(--warn)} .savestate.failed{color:var(--bad)} .savestate.failed i{background:var(--bad)}
.savestate.failed .linkbtn{color:var(--bad)}
.topacts{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.mapbody{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;min-height:0}
.stage{position:relative;overflow:hidden;touch-action:none;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.3px);cursor:grab;min-height:0}
.stage.panning{cursor:grabbing}
.stage.dropping{box-shadow:inset 0 0 0 3px var(--accent)}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.wires{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.wires path{fill:none;stroke:var(--muted);stroke-width:1.6;opacity:.55}
.wires circle{fill:var(--muted);opacity:.7}
.card{position:absolute;width:220px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;box-shadow:var(--shadow);cursor:grab;user-select:none;-webkit-user-select:none;display:grid;gap:7px}
.card.sel{outline:2px solid var(--accent);outline-offset:1px}
.card.linksrc{outline:2px dashed var(--accent);outline-offset:2px}
.card.dragging{cursor:grabbing;box-shadow:0 14px 30px rgba(0,0,0,.18);z-index:3}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:6px}
.card h3{font-size:14px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.card p{margin:0;color:var(--muted);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card img{display:block;width:100%;border-radius:6px;pointer-events:none}
.who,.due{font-size:11.5px;font-family:var(--f-mono);color:var(--muted)}
.due.over{color:var(--bad)}
.frames{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.frames img,.frames figure img{aspect-ratio:16/9;object-fit:cover;border-radius:3px;width:100%;display:block}
.frames.v img{aspect-ratio:9/16}
.frames figure{margin:0;display:grid;gap:2px}
.frames figcaption{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-align:center}
.note{font-size:11.5px;color:var(--muted)}
.yt{aspect-ratio:16/9;border-radius:6px;background:linear-gradient(135deg,color-mix(in srgb,var(--k-intro) 70%,#000),color-mix(in srgb,var(--k-intro) 40%,#000));display:grid;place-items:center;color:#fff;position:relative}
.yt svg{width:34px;height:34px;opacity:.92}
.yt span{position:absolute;left:8px;bottom:6px;font-size:11px;font-family:var(--f-mono);opacity:.85}
.linkline{font-family:var(--f-mono);font-size:11.5px;color:var(--k-ref);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--bg)}
.filebox{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:7px 8px;background:var(--bg);min-width:0}
.filebox b{font-family:var(--f-mono);font-size:11px;background:var(--k-ref);color:var(--surface);border-radius:4px;padding:2px 5px;flex:none}
.filebox span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.proc{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:10px;flex-wrap:wrap}
.proc.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.zoomctl{position:absolute;right:12px;top:12px;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);overflow:hidden}
.zoomctl button{border:0;background:none;padding:6px 10px;cursor:pointer;color:var(--ink)}
.zoomctl button:hover{background:var(--sunk)}
.zoomctl span{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:44px;text-align:center}
.toolbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:2px;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none}
.toolbar button{border:0;background:none;padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;font-size:13px;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.toolbar button:hover{background:var(--sunk)}
.toolbar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toolbar .dot{width:8px;height:8px;border-radius:50%;background:var(--k)}
.toolbar .sep{width:1px;background:var(--line);margin:4px 3px;flex:none}
.linkbanner{position:absolute;top:12px;left:12px;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:7px 12px;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);max-width:calc(100% - 200px)}
.linkbanner button{border:0;background:rgba(255,255,255,.18);color:inherit;border-radius:6px;padding:2px 8px;cursor:pointer}
.hint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;padding:16px}
.hint div{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px 22px;max-width:360px;text-align:center;display:grid;gap:6px;color:var(--muted);font-size:13px}
.hint b{color:var(--ink);font-family:var(--f-display);font-size:16px}
.detail{width:330px;border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding:16px;display:grid;gap:14px;align-content:start}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.field{display:grid;gap:5px;border:0;padding:0;margin:0;min-width:0}
.field>span,.field>legend{font-size:12.5px;color:var(--muted);font-weight:500;padding:0}
.field em{font-style:normal;color:var(--muted);font-weight:400;margin-left:4px;font-size:12px}
input:not([type=checkbox]):not([type=radio]):not([type=file]),textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{resize:vertical;line-height:1.5}
input[type=file]{font-size:13px;max-width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;font-size:12.5px}
.meta dt{color:var(--muted)} .meta dd{margin:0;overflow-wrap:anywhere}
.linked{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent)}
.dacts{display:flex;flex-wrap:wrap;gap:6px;padding-top:12px;border-top:1px solid var(--line)}

/* 모달 */
#modal[hidden]{display:none}
.modal-back{position:fixed;inset:0;background:rgba(8,18,16,.48);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;width:min(580px,100%);max-height:calc(100% - 24px);overflow:auto;padding:22px;display:grid;gap:16px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.modal.wide{width:min(760px,100%)}
.modal p{margin:0}
.stack{display:grid;gap:14px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{position:relative;cursor:pointer}
.choice input,.start input{position:absolute;opacity:0;pointer-events:none}
.choice span{display:block;padding:6px 12px;border:1px solid var(--line);border-radius:99px;font-size:13px}
.choice input:checked+span,.start input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.choice input:focus-visible+span,.start input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.starts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.start{position:relative;cursor:pointer}
.start span{display:grid;gap:2px;border:1px solid var(--line);border-radius:10px;padding:12px;height:100%}
.start small{color:var(--muted);font-size:12px}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps i{flex:1 1 40px;height:4px;border-radius:2px;background:var(--sunk)}

.avatar{width:72px;height:72px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:28px}

  .topacts .btn{padding:5px 8px}

}

.selbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:4px 4px 4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);font-size:13px;z-index:6;white-space:nowrap;max-width:calc(100% - 24px)}

.marquee{position:absolute;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);pointer-events:none;z-index:4}

.board li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.board-no{font-size:13px;color:var(--k-scene);font-weight:500;padding-top:2px}
.board h3{font-size:15px;font-weight:600;margin:0}
.board p{margin:4px 0 0;color:var(--muted);font-size:13.5px;white-space:pre-wrap}
.film{background:var(--film);border-radius:12px;padding:12px 0 10px;display:grid;gap:10px;min-width:0}

.film-strip{display:flex;gap:6px;overflow-x:auto;padding:0 14px 4px;scroll-padding-inline:14px;scroll-snap-type:x proximity}

.film-strip img{width:100%;border-radius:4px;display:block}
.film-strip figcaption{color:#9AA7A4;font-size:11px}
.sound-list{display:grid;gap:10px}
.sound{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px;background:var(--bg)}
.sound span{color:var(--muted);font-size:13px}
.sound audio{width:100%}
.note-paper{padding:14px 16px;border-radius:3px 3px 14px 3px;color:#2B2617;white-space:pre-wrap;font-size:14px;line-height:1.5;min-height:110px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.pick-g{display:grid;gap:6px}
.pick .pick-h{border:0;padding:8px 2px 2px;background:none}
.pick-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.yt.has img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:6px}

.adm-who{display:grid;gap:2px;min-width:0}

/* 노드 이미지·글꼴 */

.ff-myeongjo .stx,.ff-myeongjo h3,.ff-myeongjo p,.ff-myeongjo.pq,.ff-myeongjo.note-paper,.fontbtn.ff-myeongjo{font-family:'Nanum Myeongjo','Batang',serif}

<body>

  <aside class="side">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 18a12 12 0 0 1 24 0" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/><path d="M4 23c3-2.4 5.3-2.4 8 0s5.3 2.4 8 0 5.3-2.4 8 0" fill="none" stroke="var(--k-ref)" stroke-width="2.4" stroke-linecap="round"/></svg>Ballacove</div>

<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ---------- Supabase ---------- */
const SUPABASE_URL='https://stbnlohykesgkoniiifc.supabase.co';
const SUPABASE_KEY='sb_publishable_2g5UHihRAnmg7z5ORUT28g_5F3fd8yh';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const BASE=location.origin+location.pathname;

const DAY=864e5;
const $=s=>document.querySelector(s);
const now=()=>Date.now();
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmtDate=t=>{const d=new Date(t);return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`};
const clock=t=>{const d=new Date(t);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fmtDT=t=>`${fmtDate(t)} ${clock(t)}`;
const isoDate=t=>{const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const ts=v=>v?new Date(v).getTime():null;
const iso=v=>v?new Date(v).toISOString():null;
function rel(t){const s=(now()-t)/1000;if(s<60)return '방금';if(s<3600)return `${Math.floor(s/60)}분 전`;if(s<86400)return `${Math.floor(s/3600)}시간 전`;if(s<86400*30)return `${Math.floor(s/86400)}일 전`;return fmtDate(t)}
function dDay(t){const d=Math.round((sod(t)-sod(now()))/DAY);return d>0?`D-${d}`:d===0?'오늘 마감':`${-d}일 지남`}
const tc=s=>`${pad(Math.floor(s/60))}:${pad(Math.floor(s%60))}`;

const KIND={idea:'아이디어·기획',intro:'도입부',ref:'참고자료',scene:'장면',feedback:'피드백·일정',memo:'메모',sticky:'포스트잇',text:'텍스트'};
const MEDIA={image:'이미지',frame:'영상 장면',audio:'음악',video:'영상',youtube:'YouTube',link:'웹 링크',pdf:'PDF',doc:'문서',psd:'PSD',tool:'외부 도구'};
const TYPES=['숏폼','YouTube','브랜드 영상','자유 작업'];
const PERM={owner:'소유자',editor:'편집',viewer:'보기'};
const kindLabel=c=>c.kind==='ref'&&c.media?`${MEDIA[c.media]}`:KIND[c.kind];
const LOGO='<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 18a12 12 0 0 1 24 0" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/><path d="M4 23c3-2.4 5.3-2.4 8 0s5.3 2.4 8 0 5.3-2.4 8 0" fill="none" stroke="var(--k-ref)" stroke-width="2.4" stroke-linecap="round"/></svg>';

/* ---------- 상태 ---------- */
let me=null,started=false,publicMode=false;
const emptyDb=()=>({profile:{name:'',handle:'',intro:'',fields:[],plan:'free',role:'user',fonts:[]},projects:[],trash:[],notifications:[],activity:[]});
let db=emptyDb();
const ui={view:'loading',pid:null,tab:'active',sel:null,linkFrom:null,pub:null,authMode:'login',err:''};
const hist={};
let demo=null;
const hintClosed=new Set();
const cur=()=>ui.pid==='demo'?demo:db.projects.find(p=>p.id===ui.pid);
const proj=id=>id==='demo'?demo:db.projects.find(p=>p.id===id);
const anyProj=id=>db.projects.find(p=>p.id===id)||db.trash.find(p=>p.id===id);
const PLANS={free:{name:'무료',active:3,done:3,note:'기준안 · 진행 중 3개, 완성 3개'},pro:{name:'프로',active:Infinity,done:Infinity,note:'테스트용 · 개수 제한 없음 (가격 미정)'}};
const plan=()=>PLANS[db.profile.plan]||PLANS.free;
const isAdmin=()=>db.profile.role==='admin';
const activeFull=()=>ownActive()>=plan().active;
const ownActive=()=>db.projects.filter(p=>p.status==='active'&&p.role==='owner').length;
const ownDone=()=>db.projects.filter(p=>p.status==='done'&&p.role==='owner').length;
const isMe=m=>me&&m.userId===me.id;
const memName=m=>isMe(m)?db.profile.name:m.name;
const memHandle=m=>isMe(m)?db.profile.handle:m.handle;
const dispName=m=>memName(m)||(memHandle(m)?'@'+memHandle(m):'프로필 미설정');

/* ---------- DB ↔ 화면 데이터 ---------- */
function fromRow(r,mems,profs){
  const d=r.data||{};
  const perm=r.owner_id===me.id?'owner':(mems.find(m=>m.project_id===r.id&&m.user_id===me.id)?.perm||'viewer');
  const pm=(u,pr)=>({userId:u,name:profs[u]?.name||'',handle:profs[u]?.handle||'',perm:pr});
  return normProject({id:r.id,ownerId:r.owner_id,role:perm,owner:profs[r.owner_id]?.name||'',
    title:r.title,type:r.type,status:r.status,visibility:r.visibility,inHome:r.in_home,due:ts(r.due),goal:r.goal||'',
    result:r.result,publicCards:r.public_cards||[],metrics:r.metrics,
    cards:d.cards||[],links:d.links||[],shelf:d.shelf||[],versions:d.versions||[],roles:d.roles||{},strokes:d.strokes||[],sections:d.sections||[],fonts:(d.fonts||[]).map(f=>(registerFont(f),f)),
    members:[pm(r.owner_id,'owner'),...mems.filter(m=>m.project_id===r.id).map(m=>pm(m.user_id,m.perm))],
    created:ts(r.created_at),updated:ts(r.updated_at),completed:ts(r.completed_at),deletedAt:ts(r.deleted_at)});
}
function toRow(p){return {title:p.title,type:p.type,status:p.status,visibility:p.visibility,in_home:!!p.inHome,due:iso(p.due),goal:p.goal||'',
  result:p.result||null,public_cards:p.publicCards||[],metrics:p.metrics||null,
  data:{cards:p.cards,links:p.links,shelf:p.shelf,versions:p.versions,roles:p.roles||{},strokes:p.strokes||[],sections:p.sections||[],fonts:p.fonts||[]},
  updated_at:iso(p.updated||now()),completed_at:iso(p.completed),deleted_at:iso(p.deletedAt)}}

async function loadAll(){
  const [{data:prof,error:e0},{data:myMem,error:e1}]=await Promise.all([
    sb.from('profiles').select('*').eq('id',me.id).maybeSingle(),
    sb.from('project_members').select('project_id').eq('user_id',me.id)]);
  if(e0)throw e0;if(e1)throw e1;
  const memberIds=(myMem||[]).map(m=>m.project_id);
  let q=sb.from('projects').select('*');
  q=memberIds.length?q.or(`owner_id.eq.${me.id},id.in.(${memberIds.join(',')})`):q.eq('owner_id',me.id);
  const [{data:rows,error:e2},{data:nts},{data:acts}]=await Promise.all([
    q.order('updated_at',{ascending:false}),
    sb.from('notifications').select('*').eq('user_id',me.id).order('created_at',{ascending:false}).limit(60),
    sb.from('activity').select('*').eq('user_id',me.id).order('created_at',{ascending:false}).limit(30)]);
  if(e2)throw e2;
  const pids=(rows||[]).map(r=>r.id);
  let mems=[];if(pids.length){const {data}=await sb.from('project_members').select('*').in('project_id',pids);mems=data||[]}
  const uids=[...new Set([...(rows||[]).map(r=>r.owner_id),...mems.map(m=>m.user_id)])];
  const profs={};if(uids.length){const {data}=await sb.from('profiles').select('id,name,handle').in('id',uids);(data||[]).forEach(p=>profs[p.id]=p)}
  db=emptyDb();
  if(prof)db.profile={name:prof.name||'',handle:prof.handle||'',intro:prof.intro||'',fields:prof.fields||[],plan:prof.plan||'free',role:prof.role||'user',fonts:prof.fonts||[]};
  (db.profile.fonts||[]).forEach(registerFont);
  const cutoff=now()-30*DAY;
  for(const r of rows||[]){const p=fromRow(r,mems,profs);
    if(p.deletedAt){if(p.role!=='owner')continue;if(p.deletedAt<cutoff){purgeMedia(p.id).then(()=>sb.from('projects').delete().eq('id',p.id));continue}db.trash.push(p)}else db.projects.push(p)}
  db.notifications=(nts||[]).map(n=>({id:n.id,kind:n.kind,text:n.text,pid:n.project_id,cid:n.card_id,at:ts(n.created_at),read:n.read}));
  db.activity=(acts||[]).map(a=>({at:ts(a.created_at),text:a.text,pid:a.project_id}));
}

/* ---------- 저장 ---------- */
const dirty=new Set();
let saveState='saved',saveTimer=null,lastSaved=now(),saving=false;
function markDirty(p){if(!p||p.demo||p.role==='viewer')return;p.updated=now();dirty.add(p.id);saveState='saving';paintSave();clearTimeout(saveTimer);saveTimer=setTimeout(flush,900)}
function changed(){markDirty(cur())}
async function flush(){
  clearTimeout(saveTimer);
  if(saving){saveTimer=setTimeout(flush,500);return}
  if(!dirty.size){return}
  saving=true;const ids=[...dirty];dirty.clear();let ok=true;
  for(const id of ids){const p=anyProj(id);if(!p)continue;const {error}=await sb.from('projects').update(toRow(p)).eq('id',id);if(error){ok=false;dirty.add(id);console.error(error)}}
  saving=false;
  if(!ok){saveState='failed';toast('저장하지 못했어요. 인터넷 연결을 확인한 뒤 다시 시도하세요.')}
  else if(dirty.size){saveState='saving';saveTimer=setTimeout(flush,600)}
  else{saveState='saved';lastSaved=now()}
  paintSave();
}
window.addEventListener('beforeunload',e=>{if(dirty.size||saving){e.preventDefault();e.returnValue=''}});
function paintSave(){const el=$('#savestate');if(!el)return;el.className='savestate '+saveState;
  el.innerHTML=saveState==='saving'?'<i></i>저장 중…':saveState==='failed'?'<i></i><button class="linkbtn" data-act="save-retry">저장 실패 · 다시 시도</button>':`<i></i>저장됨 ${clock(lastSaved)}`}

async function notify(kind,text,pid,cid,userId){
  const target=userId||me.id;
  const {data,error}=await sb.from('notifications').insert({user_id:target,kind,text,project_id:pid&&pid!=='demo'?pid:null,card_id:cid||null}).select().single();
  if(error){console.error(error);return}
  if(target===me.id){db.notifications.unshift({id:data.id,kind,text,pid,cid,at:ts(data.created_at),read:false});paintChrome();if(ui.view==='inbox')render()}
}
function logAct(text,pid){if(pid==='demo')return;db.activity.unshift({at:now(),text,pid});db.activity=db.activity.slice(0,30);sb.from('activity').insert({text,project_id:pid||null}).then(({error})=>error&&console.error(error))}

/* 공개 페이지: 고른 카드만 따로 복사해 둔다. 비공개 자료는 이 표에 들어가지 않는다. */
const pubResult=p=>{const r=p.result||{};return {url:r.url||'',goal:r.goal||'',period:r.period||'',tools:r.tools||''}};
function pageMembers(p){return p.members.map(m=>({userId:m.userId,name:memName(m)||'',handle:memHandle(m)||'',role:(p.roles||{})[m.userId]||'',owner:m.perm==='owner'}))}
const shouldPublish=p=>p.completed&&p.visibility==='public'&&!p.deletedAt&&p.status!=='archived';
async function syncPublicPage(p){
  if(p.role!=='owner')return;
  if(shouldPublish(p)){
    const pg=pageFromProject(p);
    const {error}=await sb.from('public_pages').upsert({project_id:p.id,owner_id:p.ownerId,title:pg.title,type:pg.type,result:pg.result,cards:pg.cards,members:pg.members,layout:pg.layout,in_home:!!p.inHome,published_at:new Date().toISOString()});
    if(error){console.error(error);toast('공개 페이지를 저장하지 못했어요')}
  }else{await sb.from('public_pages').delete().eq('project_id',p.id)}
}

/* ---------- 포트폴리오(공개 페이지) ---------- */
function approxSize(c){return c.kind==='sticky'?[200,150]:c.kind==='text'?[260,46]:c.media==='frame'?(c.orient==='v'?[170,388]:[240,221]):c.media==='audio'?[280,120]:(c.media==='youtube'||c.media==='image')?[220,250]:[220,120]}
function ytId(u){
  try{const x=new URL(u),h=x.hostname.replace(/^(www|m)\./,'');let id=null;
    if(h==='youtu.be')id=x.pathname.slice(1).split('/')[0];
    else if(/(^|\.)youtube(-nocookie)?\.com$/.test(h)){id=x.searchParams.get('v');if(!id){const m=x.pathname.match(/\/(shorts|embed|live|v)\/([\w-]+)/);if(m)id=m[2]}}
    return id&&/^[\w-]{6,20}$/.test(id)?id:null}catch(e){return null}
}
const ytThumb=id=>`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
const ytVertical=u=>/\/shorts\//.test(u||'');
function ytPlayer(url,label){
  const id=ytId(url);if(!id)return '';
  return `<div class="ytp${ytVertical(url)?' v':''}"><button class="ytp-btn" data-act="yt-play" data-id="${id}" aria-label="${esc(label||'영상')} 재생"><img src="${ytThumb(id)}" alt="" loading="lazy"><span class="ytp-play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 6.5v11l9-5.5z"/></svg></span></button></div>`;
}
function sectionOf(c,secs){const[w,h]=approxSize(c),cx=c.x+w/2,cy=c.y+h/2;let best=null;for(const s of secs){if(cx>=s.x&&cx<=s.x+s.w&&cy>=s.y&&cy<=s.y+s.h&&(!best||s.w*s.h<best.w*best.h))best=s}return best}
function pageCards(p,ids){/* font·img 포함 */
  const pick=new Set(ids||p.publicCards||[]),secs=p.sections||[];
  return p.cards.filter(c=>pick.has(c.id)).map(c=>({id:c.id,kind:c.kind,media:c.media||null,title:c.title||'',body:c.body||'',

function layoutMap(pg){

function authErr(msg){const map=[[/Invalid login credentials/i,'이메일 또는 비밀번호가 맞지 않아요.'],[/Email not confirmed/i,'메일함에서 인증 링크를 먼저 눌러 주세요.'],[/already registered|already exists/i,'이미 가입된 이메일이에요. 로그인해 주세요.'],[/Password should be at least/i,'비밀번호는 8자 이상으로 정해 주세요.'],[/rate limit|too many/i,'요청이 너무 많아요. 잠시 뒤 다시 시도해 주세요.'],[/valid email|invalid format/i,'이메일 주소 형식을 확인해 주세요.']];for(const[r,t]of map)if(r.test(msg))return t;return msg}
function mountAuth(){

    busy(btn,true);

    else if(ui.authMode==='signup')res=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:BASE}});

    if(ui.authMode==='signup'&&!res.data.session){ok.textContent=`${email}로 인증 메일을 보냈어요. 메일의 링크를 누르면 바로 시작할 수 있어요.`;ok.hidden=false}
    if(ui.authMode==='reset'){ok.textContent='재설정 링크를 보냈어요. 메일의 링크를 누르면 새 비밀번호를 정할 수 있어요.';ok.hidden=false}
  });
}

const WEB_FONTS=['Noto Sans KR','Noto Serif KR','Nanum Gothic','Nanum Gothic Coding','Nanum Brush Script','Gowun Dodum','Gowun Batang','Hahmlet','Black Han Sans','Do Hyeon','Dongle','Gaegu','Hi Melody','Poor Story','Gamja Flower','Cute Font','Single Day','Song Myung','Stylish','Yeon Sung','Gugi','Dokdo','East Sea Dokdo','Kirang Haerang','Black And White Picture','Orbit','Diphylleia','Gasoek One','Bagel Fat One','Moirai One','Grandiflora One'];

const fontReg=new Map();
const gLoaded=new Set();
const cleanName=n=>String(n||'').replace(/["'\\;<>{}]/g,'').slice(0,80);
function ensureGoogleFont(name){
  name=cleanName(name);if(!name||gLoaded.has(name))return;gLoaded.add(name);
  const l=document.createElement('link');l.rel='stylesheet';l.href=`https://fonts.googleapis.com/css2?family=${encodeURIComponent(name).replace(/%20/g,'+')}&display=swap`;document.head.appendChild(l);

function registerFont(def){
  if(!def||!def.id||!def.url||fontReg.has(def.id))return;fontReg.set(def.id,def);
  try{const f=new FontFace('BCU_'+def.id,`url("${def.url}")`);f.load().then(x=>document.fonts.add(x)).catch(()=>{})}catch(e){}
}
function familyCSS(key){
  if(!key||BUILTIN.has(key))return '';
  const v=cleanName(key.slice(2));
  if(key.startsWith('g:')){ensureGoogleFont(v);return `'${v}'`}
  if(key.startsWith('l:'))return `'${v}'`;
  if(key.startsWith('u:'))return `'BCU_${v}'`;
  return '';
}
const ff=c=>!c.font?'':BUILTIN.has(c.font)?' ff-'+c.font:' ffv';

function fontLabel(key){

  if(key.startsWith('u:'))return fontReg.get(key.slice(2))?.name||'추가한 글꼴';

}

function anchorOf(A,B){
  const ac=[A.x+A.w/2,A.y+A.h/2],bc=[B.x+B.w/2,B.y+B.h/2],dx=bc[0]-ac[0],dy=bc[1]-ac[1];
  const hx=Math.abs(dx)-(A.w+B.w)/2,vy=Math.abs(dy)-(A.h+B.h)/2;
  if(hx>vy)return dx>0?{p:[A.x+A.w,ac[1]],d:[1,0]}:{p:[A.x,ac[1]],d:[-1,0]};
  return dy>0?{p:[ac[0],A.y+A.h],d:[0,1]}:{p:[ac[0],A.y],d:[0,-1]};
}
function linkGeom(l,B){
  const A=B[l.a],C=B[l.b];if(!A||!C)return null;
  const s=anchorOf(A,C),e=anchorOf(C,A),len=clamp(Math.hypot(e.p[0]-s.p[0],e.p[1]-s.p[1])/2.4,24,160);
  return {s:s.p,e:e.p,c1:[s.p[0]+s.d[0]*len,s.p[1]+s.d[1]*len],c2:[e.p[0]+e.d[0]*len,e.p[1]+e.d[1]*len]};
}
function bez(g,t){const u=1-t;return [u*u*u*g.s[0]+3*u*u*t*g.c1[0]+3*u*t*t*g.c2[0]+t*t*t*g.e[0],u*u*u*g.s[1]+3*u*u*t*g.c1[1]+3*u*t*t*g.c2[1]+t*t*t*g.e[1]]}
function drawWires(){
  const p=cur(),svg=$('#wires');if(!svg||!p)return;const B=boxesNow();
  let h='<defs><marker id="arw" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="arw"/></marker><marker id="arws" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" class="arw-sel"/></marker></defs>';
  for(const l of p.links){
    const g=linkGeom(l,B);if(!g)continue;const sel=S.l===l.id;
    h+=`<path class="w${sel?' sel':''}" d="M${g.s[0]} ${g.s[1]}C${g.c1[0]} ${g.c1[1]} ${g.c2[0]} ${g.c2[1]} ${g.e[0]} ${g.e[1]}"${l.type==='arrow'?` marker-end="url(#${sel?'arws':'arw'})"`:''}/>`;
    if(l.type!=='arrow')h+=`<circle cx="${g.s[0]}" cy="${g.s[1]}" r="3"/><circle cx="${g.e[0]}" cy="${g.e[1]}" r="3"/>`;
  }
  if(tool.cur==='connect'&&conn.from&&conn.hover&&B[conn.from]){const pt=conn.hover,s=anchorOf(B[conn.from],{x:pt.x,y:pt.y,w:0,h:0});h+=`<path class="pv" d="M${s.p[0]} ${s.p[1]}L${pt.x} ${pt.y}"/>`}
  svg.innerHTML=h;posLinkPop();
}
function hitLink(w,tol){
  const p=cur(),B=boxesNow();
  for(let i=p.links.length-1;i>=0;i--){const l=p.links[i],g=linkGeom(l,B);if(!g)continue;let prev=g.s;for(let j=1;j<=24;j++){const q=bez(g,j/24);if(distSeg(w.x,w.y,prev[0],prev[1],q[0],q[1])<=tol)return l;prev=q}}
  return null;
}
function posLinkPop(){
  const el=$('#linkpop');if(!el)return;const p=cur();const l=S.l&&p.links.find(x=>x.id===S.l);
  if(!l||ro(p)){el.hidden=true;return}
  const g=linkGeom(l,boxesNow());if(!g){el.hidden=true;return}
  const m=bez(g,.5),v=V();el.style.left=(v.x+m[0]*v.z)+'px';el.style.top=(v.y+m[1]*v.z)+'px';
  el.innerHTML=`<button class="optbtn" data-act="lset" data-v="line" aria-pressed="${l.type!=='arrow'}">${ico('line')}선</button><button class="optbtn" data-act="lset" data-v="arrow" aria-pressed="${l.type==='arrow'}">${ico('arrow')}화살표</button>${l.type==='arrow'?'<button class="optbtn" data-act="lflip">방향 바꾸기</button>':''}<button class="optbtn danger-t" data-act="ldel">삭제</button>`;
  el.hidden=false;
}
function connectCards(a,b){
  const p=cur();const ex=p.links.find(l=>(l.a===a&&l.b===b)||(l.a===b&&l.b===a));
  if(ex){selClear();S.l=ex.id;selSync();toast('이미 연결돼 있어요');return}
  checkpoint();p.links.push({id:uid(),a,b,type:tool.linkType});drawWires();changed();if(ui.sel)renderDetail();
}

const views={};
const V=()=>views[ui.pid]||(views[ui.pid]={x:40,y:40,z:1});
function applyView(){const v=V(),st=$('#stage');if(!st)return;$('#world').style.transform=`translate(${v.x}px,${v.y}px) scale(${v.z})`;st.style.backgroundSize=`${22*v.z}px ${22*v.z}px`;st.style.backgroundPosition=`${v.x}px ${v.y}px`;$('#zoomv').textContent=Math.round(v.z*100)+'%';posLinkPop()}
function zoomAt(mx,my,f){const v=V();const nz=clamp(v.z*f,.2,2.5);const k=nz/v.z;v.x=mx-(mx-v.x)*k;v.y=my-(my-v.y)*k;v.z=nz;applyView()}
function fit(){
  const p=cur(),st=$('#stage');if(!st)return;
  const R=[...p.cards.map(cbox),...p.sections.map(s=>({x:s.x,y:s.y-40,w:s.w,h:s.h+40})),...p.strokes.map(kbox)];
  if(!R.length){views[ui.pid]={x:40,y:40,z:1};applyView();return}
  const x0=Math.min(...R.map(r=>r.x)),y0=Math.min(...R.map(r=>r.y)),x1=Math.max(...R.map(r=>r.x+r.w)),y1=Math.max(...R.map(r=>r.y+r.h));
  const W=st.clientWidth,H=st.clientHeight-80;
  const z=clamp(Math.min((W-40)/(x1-x0),(H-40)/(y1-y0)),.2,1.1);
  views[ui.pid]={z,x:(W-(x1-x0)*z)/2-x0*z,y:Math.max(16,(H-(y1-y0)*z)/2)-y0*z};applyView();
}
function centerPt(){const st=$('#stage'),v=V();return {x:(st.clientWidth/2-v.x)/v.z,y:(st.clientHeight/2-40-v.y)/v.z}}
function toWorld(cx,cy){const r=$('#stage').getBoundingClientRect(),v=V();return {x:(cx-r.left-v.x)/v.z,y:(cy-r.top-v.y)/v.z}}

function checkpoint(s){const h=H();h.u.push(s||snap(cur()));if(h.u.length>80)h.u.shift();h.r=[]}
function restoreSnap(s){
  editing=null;const p=cur(),o=JSON.parse(s);
  p.cards=o.cards||[];p.links=o.links||[];p.shelf=o.shelf||[];p.strokes=o.strokes||[];p.sections=o.sections||[];normLinks(p);

function selectAll(){const p=cur();selClear();p.cards.forEach(c=>S.c.add(c.id));p.strokes.forEach(k=>S.k.add(k.id));p.sections.forEach(s=>S.x.add(s.id));selSync()}
function deleteSel(){
  const p=cur();if(!p||ro(p)||selEmpty())return;if(editing)finishEdit();
  checkpoint();const C=new Set(S.c),onlyLink=!C.size&&!S.k.size&&!S.x.size;
  p.cards=p.cards.filter(c=>!C.has(c.id));
  p.links=p.links.filter(l=>l.id!==S.l&&!C.has(l.a)&&!C.has(l.b));
  p.strokes=p.strokes.filter(k=>!S.k.has(k.id));
  p.sections=p.sections.filter(s=>!S.x.has(s.id));
  selClear();renderCards();selSync();changed();
  toast(`${onlyLink?'연결선을':'선택한 항목을'} 지웠어요 · 되돌리기(Ctrl+Z)로 복구할 수 있어요`);
}
function collectMove(){
  const p=cur(),C=new Set(S.c),K=new Set(S.k),X=new Set(S.x);
  for(const sid of S.x){const s=secOf(sid);if(!s)continue;const r={x:s.x,y:s.y,w:s.w,h:s.h};
    p.cards.forEach(c=>{const b=cbox(c);if(inside(b.x+b.w/2,b.y+b.h/2,r))C.add(c.id)});
    p.strokes.forEach(k=>{const b=kbox(k);if(inside(b.x+b.w/2,b.y+b.h/2,r))K.add(k.id)});
    p.sections.forEach(o=>{if(o.id!==s.id&&contains(r,o))X.add(o.id)});
  }
  return {c:p.cards.filter(c=>C.has(c.id)).map(c=>[c,c.x,c.y]),k:p.strokes.filter(k=>K.has(k.id)).map(k=>[k,k.pts.map(q=>q.slice())]),x:p.sections.filter(s=>X.has(s.id)).map(s=>[s,s.x,s.y])};
}

/* 카드 추가·편집 */
const DEF={idea:'새 아이디어',intro:'도입부',memo:'메모',feedback:'수정 의견',sticky:'',text:''};
function addCard(kind,extra={},opts={}){
  const p=cur();if(!p||ro(p))return null;if(editing)finishEdit();checkpoint();
  const at=extra.at||centerPt();delete extra.at;
  const c=Object.assign({id:uid(),kind,title:kind==='scene'?`장면 ${p.cards.filter(x=>x.kind==='scene').length+1}`:(DEF[kind]??''),body:'',created:now(),public:!['feedback','sticky','text'].includes(kind)},extra);
  if(opts.tl){c.x=Math.round(at.x);c.y=Math.round(at.y)}
  else{c.x=Math.round(at.x-110+(opts.exact?0:Math.random()*30-15));c.y=Math.round(at.y-40+(opts.exact?0:Math.random()*30-15))}
  p.cards.push(c);appendCardEl(c);selClear();S.c.add(c.id);selSync();changed();
  if(!opts.noFocus&&!['sticky','text'].includes(kind)){const t=$('#d-title');if(t&&matchMedia('(min-width:761px)').matches){t.focus();t.select()}}
  return c;
}
function startEdit(id,created){
  if(editing&&editing.id===id)return;if(editing)finishEdit();
  const p=cur(),c=card(id);if(!c||ro(p)||!['sticky','text'].includes(c.kind))return;
  const el=cardEl(id);if(!el)return;
  editing={id,before:c.body||'',snap:created?null:snap(p),created:!!created};
  el.classList.add('editing');
  const box=el.querySelector('.stx');
  box.innerHTML=`<textarea class="edit" rows="1" aria-label="${c.kind==='sticky'?'포스트잇 내용':'텍스트'}"></textarea>`;
  const ta=box.querySelector('textarea');ta.value=c.body||'';
  const fitH=()=>{ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';drawWires()};
  ta.addEventListener('input',()=>{c.body=ta.value;fitH();changed()});
  ta.addEventListener('blur',finishEdit);
  ta.addEventListener('keydown',ev=>{ev.stopPropagation();if(ev.key==='Escape'){ev.preventDefault();ta.blur()}});
  fitH();ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
  if(!matchMedia('(min-width:761px)').matches){const d=$('#detail');if(d)d.hidden=true}
}
function finishEdit(){
  if(!editing)return;const ed=editing;editing=null;
  const p=cur(),c=p&&p.cards.find(x=>x.id===ed.id);if(!c)return;
  if(c.kind==='text'&&!(c.body||'').trim()){
    p.cards=p.cards.filter(x=>x.id!==c.id);p.links=p.links.filter(l=>l.a!==c.id&&l.b!==c.id);S.c.delete(c.id);
    if(ed.created)H().u.pop();else checkpoint(ed.snap);
    cardEl(c.id)?.remove();drawWires();paintHint();selSync();changed();return;
  }
  if(!ed.created&&(c.body||'')!==ed.before)checkpoint(ed.snap);
  const el=cardEl(c.id);if(el)el.outerHTML=cardHTML(c);
  drawWires();if(ui.sel===c.id)renderDetail();changed();
}
function renameSection(sid){
  const s=secOf(sid),tab=document.querySelector(`.sec-tab[data-sid="${sid}"]`);if(!s||!tab||ro(cur()))return;
  const nm=tab.querySelector('.sec-name');nm.innerHTML=`<input class="sec-in" value="${esc(s.title||'')}" maxlength="40" aria-label="섹션 이름">`;
  const inp=nm.querySelector('input');inp.focus();inp.select();
  inp.addEventListener('keydown',ev=>{ev.stopPropagation();if(ev.key==='Enter')inp.blur();if(ev.key==='Escape'){inp.dataset.cancel='1';inp.blur()}});
  inp.addEventListener('blur',()=>{const v=inp.value.trim()||'섹션';if(!inp.dataset.cancel&&v!==s.title){checkpoint();s.title=v;changed()}updateSectionEl(s)});
}
function source(c){
  if(c.media==='frame')return `영상 ${esc(c.fileName||'')} · ${tc(c.t||0)} 지점`;
  if(c.media==='audio')return `올린 음악 파일 · ${esc(c.fileName||'')}`;
  if(c.media==='image')return `직접 올린 이미지${c.fileName?' · '+esc(c.fileName):''}`;
  if(c.url)return `<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.host||'링크')} 원문 열기 ↗</a>`;
  if(c.media==='video')return `업로드 영상 ${esc(c.fileName||'')} · 원본은 추출 후 삭제됨`;
  if(c.fileName)return esc(c.fileName);
  return '캔버스에서 작성';
}

    d.innerHTML=`${head}${opts}${`<div class="field"><span>글꼴</span>${r?`<span>${esc(fontLabel(c.font||''))}</span>`:fontButton(c.font||'','card')}</div>`}${sizeRow}${r?'':'<button class="btn sm" data-act="d-edit" style="justify-self:start">내용 쓰기</button><p class="small muted" style="margin:0">캔버스에서 두 번 누르거나, 선택된 상태에서 한 번 더 누르면 바로 쓸 수 있어요.</p>'}${linkedHTML}${acts}`;
    return;
  }
  d.innerHTML=`${head}

const STORE='media';
const AUDIO_EXT={mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',wav:'audio/wav',flac:'audio/flac',ogg:'audio/ogg',oga:'audio/ogg',opus:'audio/ogg',weba:'audio/webm'};

function baseName(n){return n.replace(/\.[^.]+$/,'')}
async function uploadMedia(p,blob,ext,type){
  if(p.demo)return URL.createObjectURL(blob);

  const {error}=await sb.storage.from(STORE).upload(path,blob,{contentType:type,cacheControl:'31536000',upsert:false});
  if(error){console.error(error);const m=error.message||'';throw new Error(/size|large|413/i.test(m)?'파일이 너무 커요 (50MB까지)':/mime|type/i.test(m)?'지원하지 않는 파일 형식이에요':'파일을 올리지 못했어요')}

}
async function purgeMedia(pid){try{const {data}=await sb.storage.from(STORE).list(pid,{limit:1000});if(data&&data.length)await sb.storage.from(STORE).remove(data.map(o=>`${pid}/${o.name}`))}catch(e){console.error(e)}}
function imageBlob(f,max){return new Promise((res,rej)=>{

  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('이 형식의 이미지는 열 수 없어요'))};im.src=url;

async function addAudio(f,at){

function seek(v,t){return new Promise((res,rej)=>{const to=setTimeout(()=>rej(new Error('장면을 읽는 데 시간이 너무 오래 걸려요')),12000);v.onseeked=()=>{clearTimeout(to);res()};v.currentTime=t})}
function probeVideo(f){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(f),v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';
  const fail=m=>{clearTimeout(to);v.removeAttribute('src');v.load();URL.revokeObjectURL(url);rej(new Error(m))};
  const to=setTimeout(()=>fail('영상 정보를 읽지 못했어요'),15000);
  v.onloadeddata=()=>{clearTimeout(to);if(!isFinite(v.duration)||!v.videoWidth)return fail('영상 길이를 확인할 수 없어요');
    res({v,duration:v.duration,w:v.videoWidth,h:v.videoHeight,dispose(){v.removeAttribute('src');v.load();URL.revokeObjectURL(url)}})};
  v.onerror=()=>fail('이 형식의 영상은 열 수 없어요. MP4나 MOV로 바꿔서 올려 주세요.');

function askFrameCount(f,meta){return new Promise(resolve=>{

  modal(`<h2>영상에서 장면 뽑기</h2><p class="muted small" style="margin:0">${esc(f.name)} · 길이 <span class="mono">${tc(meta.duration)}</span></p>
  <label class="field"><span>뽑을 장면 수 <b class="mono" id="fc-n">${last}</b>장<em>4~15장</em></span><input type="range" id="fc" min="4" max="15" step="1" value="${last}"></label>
  <div class="fc-times mono" id="fc-times"></div>

  <div class="mfoot"><button class="btn ghost" data-act="fc-cancel">취소</button><button class="btn primary" data-act="fc-ok" id="fc-ok">${last}장 뽑기</button></div>`,m=>{
    const r=m.querySelector('#fc');const upd=()=>{const n=+r.value;m.querySelector('#fc-n').textContent=n;m.querySelector('#fc-ok').textContent=`${n}장 뽑기`;m.querySelector('#fc-times').textContent=times(n).map(tc).join(' · ')};

async function addVideo(f,at){

  const n=await askFrameCount(f,meta);if(!n){meta.dispose();return}
  const p=cur();if(!p||ro(p)){meta.dispose();return}

async function extractToNodes(p,f,meta,n,anchor){
  const {v,duration}=meta,vert=meta.h>meta.w;
  const s=p.demo?Math.min(1,480/Math.max(meta.w,meta.h)):Math.min(1,(vert?720:1280)/meta.w,(vert?1280:720)/meta.h);
  const W=Math.round(meta.w*s),Hh=Math.round(meta.h*s);
  const cardW=vert?170:240,cardH=Math.round(cardW*meta.h/meta.w)+86,cols=Math.min(n,vert?6:5),rows=Math.ceil(n/cols),gap=24,pad=28;
  const secW=cols*cardW+(cols-1)*gap+pad*2,secH=rows*cardH+(rows-1)*gap+pad*2;
  if(editing)finishEdit();checkpoint();
  let sx,sy;
  if(anchor){sx=anchor.x-secW/2;sy=anchor.y-secH/2}
  else{const R=[...p.cards.map(cbox),...p.sections.map(o=>({x:o.x,y:o.y,w:o.w,h:o.h})),...p.strokes.map(kbox)];
    if(R.length){sx=Math.min(...R.map(r=>r.x));sy=Math.max(...R.map(r=>r.y+r.h))+110}else{const c=centerPt();sx=c.x-secW/2;sy=c.y-secH/2}}
  const sec={id:uid(),x:Math.round(sx),y:Math.round(sy),w:secW,h:secH,title:baseName(f.name),busy:`장면 추출 중 0/${n}`};
  p.sections.push(sec);
  const open=()=>ui.view==='map'&&ui.pid===p.id;
  if(open()){renderSections();paintHint();selClear();S.x.add(sec.id);selSync();
    if(!anchor){const st=$('#stage'),v=V();const z=clamp(Math.min(v.z,(st.clientWidth-60)/secW,(st.clientHeight-160)/(secH+40)),.2,1.1);views[ui.pid]={z,x:st.clientWidth/2-(sec.x+secW/2)*z,y:(st.clientHeight-80)/2-(sec.y+secH/2)*z};applyView()}}
  markDirty(p);
  const cv=document.createElement('canvas');cv.width=W;cv.height=Hh;const x=cv.getContext('2d');
  let made=0,err=null;
  try{
    for(let i=0;i<n;i++){
      if(!p.sections.includes(sec))throw new Error('섹션이 지워져서 멈췄어요');
      const t=duration*(i+.5)/n;await seek(v,t);x.drawImage(v,0,0,W,Hh);
      const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.82));if(!blob)throw new Error('장면 이미지를 만들지 못했어요');
      const url=await uploadMedia(p,blob,'jpg','image/jpeg');
      if(!p.sections.includes(sec))throw new Error('섹션이 지워져서 멈췄어요');
      const col=i%cols,row=Math.floor(i/cols);
      const c={id:uid(),kind:'ref',media:'frame',img:url,t,orient:vert?'v':'h',title:`장면 ${i+1}`,body:'',fileName:f.name,x:sec.x+pad+col*(cardW+gap),y:sec.y+pad+row*(cardH+gap),created:now(),public:true};

  markDirty(p);
  if(err){toast(`장면 추출이 ${made?made+'장에서 ':''}멈췄어요 · ${err.message}`);notify('alert',`‘${f.name}’ 장면 추출이 ${made?`${made}장에서 멈췄어요`:'실패했어요'}. 원본 영상은 보관하지 않으니 다시 올려 주세요.`,p.id)}
  else{toast(`장면 ${n}장을 만들었어요 · 원본 영상은 저장하지 않았어요`);logAct(`‘${p.title}’에 영상 장면 ${n}장을 추가했어요`,p.id)}
}
async function addFiles(files,at){

function classify(u){let h;try{h=new URL(u).hostname.replace(/^www\./,'')}catch(e){return null}

const UI_SEL='.toolbar,.toolopts,.zoomctl,.linkbanner,.selbar,.linkpop,button,a,input,textarea,select,audio,label';
function mountMap(){

  renderCards();applyView();paintSave();paintTool();paintConn();
  requestAnimationFrame(()=>{fit();selSync()});
  const ptrs=new Map();let op=null;
  const local=(cx,cy)=>{const b=st.getBoundingClientRect();return {x:cx-b.left,y:cy-b.top}};
  const showBox=(o,cx,cy,cls)=>{const m=$('#marquee'),a=local(Math.min(o.sx,cx),Math.min(o.sy,cy));m.className='marquee'+(cls?' '+cls:'');Object.assign(m.style,{left:a.x+'px',top:a.y+'px',width:Math.abs(cx-o.sx)+'px',height:Math.abs(cy-o.sy)+'px'});m.hidden=false};
  const hideBox=()=>{$('#marquee').hidden=true};

    selClear();if(o.prev){o.prev.c.forEach(i=>S.c.add(i));o.prev.k.forEach(i=>S.k.add(i));o.prev.x.forEach(i=>S.x.add(i))}
    p.cards.forEach(c=>{if(overlap(cbox(c),R))S.c.add(c.id)});
    p.strokes.forEach(k=>{if(overlap(kbox(k),R)&&k.pts.some(([x,y])=>inside(x,y,R)))S.k.add(k.id)});
    p.sections.forEach(s=>{if(contains(R,s))S.x.add(s.id)});

    if(t==='select'){

      const l=hitLink(w,8/v.z);if(l){selClear();S.l=l.id;selSync();return}
      const k=hitStroke(w,6/v.z);if(k){if(!S.k.has(k.id)){if(!e.shiftKey)selClear();S.k.add(k.id);selSync()}if(e.altKey)return altDup();op={...base,type:'move',pos:collectMove(),snap:snap(p)};return}
      op={...base,type:'marquee',prev:e.shiftKey?{c:[...S.c],k:[...S.k],x:[...S.x]}:null};return;
    }
    if(t==='connect'){if(ce){const id=ce.dataset.id;if(!conn.from)conn.from=id;else if(conn.from!==id){connectCards(conn.from,id);conn.from=null}}else conn.from=null;paintConn();return}
    if(t==='sticky'||t==='text'){op={...base,type:'place',kind:t};return}
    if(t==='section'){op={...base,type:'secdraw'};return}
    if(t==='pen'){op={...base,type:'pen',snap:snap(p),pts:[[+w.x.toFixed(1),+w.y.toFixed(1)]]};liveStart(op);return}
    if(t==='eraser'){op={...base,type:'erase',snap:snap(p),hit:false};eraseAt(w,op);return}
  });
  st.addEventListener('pointermove',e=>{
    if(!ptrs.size&&tool.cur==='connect'&&conn.from&&e.pointerType==='mouse'){conn.hover=toWorld(e.clientX,e.clientY);drawWires();return}
    if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(!op)return;
    const v=V();
    if(op.type==='pinch'){if(ptrs.size<2)return;const[a,b]=[...ptrs.values()];const rc=st.getBoundingClientRect();const m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};const nz=clamp(op.z0*Math.hypot(a.x-b.x,a.y-b.y)/op.d0,.2,2.5);const k=nz/op.z0;const mx=op.m0.x-rc.left,my=op.m0.y-rc.top;v.x=mx-(mx-op.x0)*k+(m.x-op.m0.x);v.y=my-(my-op.y0)*k+(m.y-op.m0.y);v.z=nz;applyView();return}
    const dx=e.clientX-op.sx,dy=e.clientY-op.sy;
    if(!op.moved){
      if(Math.hypot(dx,dy)<4&&op.type!=='pen'&&op.type!=='erase')return;
      op.moved=true;
      if(op.type==='move')op.pos.c.forEach(([c])=>cardEl(c.id)?.classList.add('dragging'));
      if(op.type==='tap'){op.type='pan';st.classList.add('panning')}
    }
    const w=toWorld(e.clientX,e.clientY);
    switch(op.type){
      case 'pan':v.x=op.ox+dx;v.y=op.oy+dy;applyView();break;
      case 'move':{const ddx=dx/v.z,ddy=dy/v.z;
        op.pos.c.forEach(([c,x,y])=>{c.x=Math.round(x+ddx);c.y=Math.round(y+ddy);const el=cardEl(c.id);if(el){el.style.left=c.x+'px';el.style.top=c.y+'px'}});
        op.pos.x.forEach(([s,x,y])=>{s.x=Math.round(x+ddx);s.y=Math.round(y+ddy);const el=document.querySelector(`.section[data-sid="${s.id}"]`);if(el){el.style.left=s.x+'px';el.style.top=s.y+'px'}});
        if(op.pos.k.length){op.pos.k.forEach(([k,pts])=>{k.pts=pts.map(([a,b])=>[+(a+ddx).toFixed(1),+(b+ddy).toFixed(1)])});drawInk()}
        drawWires();break}
      case 'resize':{op.s.w=Math.max(160,Math.round(op.ow+dx/v.z));op.s.h=Math.max(100,Math.round(op.oh+dy/v.z));const el=document.querySelector(`.section[data-sid="${op.s.id}"]`);if(el){el.style.width=op.s.w+'px';el.style.height=op.s.h+'px'}break}
      case 'marquee':showBox(op,e.clientX,e.clientY);marquee(op,e.clientX,e.clientY);break;
      case 'secdraw':showBox(op,e.clientX,e.clientY,'secdraw');break;
      case 'pen':{const l=op.pts[op.pts.length-1];if(Math.hypot(w.x-l[0],w.y-l[1])*v.z>=2){op.pts.push([+w.x.toFixed(1),+w.y.toFixed(1)]);liveUpdate(op)}break}
      case 'erase':eraseAt(w,op);break;
    }
  });
  const end=(e,cancel)=>{
    if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
    if(!op)return;if(op.type==='pinch'){if(!ptrs.size)op=null;return}
    const o=op;op=null;st.classList.remove('panning');hideBox();
    const w=toWorld(e.clientX,e.clientY);
    switch(o.type){
      case 'move':
        o.pos.c.forEach(([c])=>cardEl(c.id)?.classList.remove('dragging'));
        if(o.dup&&(!o.moved||cancel)){restoreSnap(o.snap);break}
        if(o.moved){checkpoint(o.snap);changed();if(o.dup)toast(`${o.pos.c.length+o.pos.k.length+o.pos.x.length}개를 복제했어요`)}
        else if(!cancel&&o.clickId&&!e.shiftKey){
          if(o.was&&(S.c.size>1||S.k.size||S.x.size)){selClear();S.c.add(o.clickId);selSync()}
          else if(o.was){const c=card(o.clickId);if(c&&(c.kind==='sticky'||c.kind==='text'))startEdit(c.id)}
        }
        break;
      case 'resize':if(o.moved){checkpoint(o.snap);changed()}break;
      case 'marquee':if(!o.moved&&!cancel)selClear();selSync();break;
      case 'tap':if(!cancel)setSel(o.id);break;
      case 'secdraw':{if(cancel)break;let x=Math.min(o.w0.x,w.x),y=Math.min(o.w0.y,w.y),ww=Math.abs(w.x-o.w0.x),hh=Math.abs(w.y-o.w0.y);
        if(!o.moved||ww<60||hh<60){x=o.w0.x;y=o.w0.y;ww=480;hh=320}
        checkpoint();const s={id:uid(),x:Math.round(x),y:Math.round(y),w:Math.round(ww),h:Math.round(hh),title:'섹션'};p.sections.push(s);
        setTool('select');selClear();S.x.add(s.id);renderSections();paintHint();selSync();changed();break}
      case 'place':{if(cancel)break;const k=o.kind;
        const c=addCard(k,k==='sticky'?{color:tool.stC,font:tool.font,at:{x:o.w0.x-100,y:o.w0.y-70}}:{size:'m',font:tool.font,at:{x:o.w0.x-6,y:o.w0.y-16}},{tl:true,noFocus:true});
        setTool('select');if(c)startEdit(c.id,true);break}
      case 'pen':{liveEnd();if(cancel)break;checkpoint(o.snap);p.strokes.push({id:uid(),pts:o.pts,w:tool.penW,c:tool.penC});drawInk();paintHint();changed();break}
      case 'erase':if(o.hit){checkpoint(o.snap);changed()}break;
    }
  };
  st.addEventListener('pointerup',e=>end(e,false));st.addEventListener('pointercancel',e=>end(e,true));
  st.addEventListener('pointerleave',()=>{if(!ptrs.size&&conn.hover){conn.hover=null;drawWires()}});
  st.addEventListener('wheel',e=>{e.preventDefault();const rc=st.getBoundingClientRect();if(e.ctrlKey||e.metaKey||Math.abs(e.deltaY)>Math.abs(e.deltaX)&&!e.shiftKey&&e.deltaMode===0&&Math.abs(e.deltaY)>=40){zoomAt(e.clientX-rc.left,e.clientY-rc.top,Math.exp(-e.deltaY*.0018))}else{const v=V();v.x-=e.deltaX;v.y-=e.deltaY;applyView()}},{passive:false});

}

function genFrame(h,i,label){
  const c=document.createElement('canvas');c.width=320;c.height=180;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,180);g.addColorStop(0,`hsl(${h},35%,${12+i*3}%)`);g.addColorStop(1,`hsl(${h+30},45%,${24+i*4}%)`);
  x.fillStyle=g;x.fillRect(0,0,320,180);
  for(let k=0;k<5;k++){const cx=30+((k*67+i*41)%280),cy=30+((k*29+i*17)%80);const rg=x.createRadialGradient(cx,cy,0,cx,cy,30+k*3);rg.addColorStop(0,`hsla(${40+k*12},90%,70%,.85)`);rg.addColorStop(1,'hsla(40,90%,60%,0)');x.fillStyle=rg;x.fillRect(0,0,320,180)}
  x.fillStyle='rgba(0,0,0,.35)';x.fillRect(0,130,320,50);x.fillStyle=`hsl(${h},20%,8%)`;x.fillRect(100+i*10,84,22,66);x.fillRect(200-i*8,96,16,54);
  x.fillStyle='rgba(255,255,255,.85)';x.font='14px monospace';x.fillText(label,10,166);
  try{return c.toDataURL('image/jpeg',.8)}catch(e){return ''}
}

  modal(`<h2>버전 기록</h2><p class="muted">자동저장과 별개예요. 이름을 붙인 저장 지점을 만들고, 확인한 뒤 이전 상태로 복구할 수 있어요.</p>
  ${r?'':`<form id="vform" class="inline"><input id="vname" required maxlength="40" placeholder="예: 2차 구성안 · 피드백 반영 전"><button class="btn primary">저장 지점 만들기</button></form>`}
  <ul class="vlist">${p.versions.slice().reverse().map(v=>{const o=JSON.parse(v.snap);return `<li><div><b>${esc(v.name)}</b><span class="muted mono">${fmtDT(v.at)} · 카드 ${o.cards.length}장 · 연결 ${o.links.length}개</span></div>${r?'':`<button class="btn sm" data-act="v-restore" data-id="${v.id}">이 버전으로 복구</button>`}</li>`}).join('')||'<li class="muted">아직 저장 지점이 없어요</li>'}</ul>
  <div class="mfoot"><button class="btn ghost" data-act="close">닫기</button></div>`,m=>{
    m.querySelector('#vform')?.addEventListener('submit',e=>{e.preventDefault();const n=$('#vname').value.trim();if(!n)return;p.versions.push({id:uid(),name:n,at:now(),snap:snap(p)});logAct(`‘${n}’ 저장 지점을 만들었어요`,p.id);changed();toast('저장 지점을 만들었어요');openVersions()})});
}

/* 참여자 */
function openMembers(){
  const p=cur(),own=p.role==='owner';
  modal(`<h2>참여자</h2><p class="muted small">초대한 사람만 이 프로젝트를 볼 수 있어요. 초대받았다고 다른 프로젝트까지 보이지는 않아요. 참여해도 소유권은 넘어가지 않아요.</p>
  <ul class="vlist">${p.members.map(m=>`<li><div><b>${esc(dispName(m))}${isMe(m)?' <span class="muted" style="font-weight:400">(나)</span>':''}</b>${memHandle(m)&&memName(m)?`<span class="muted">@${esc(memHandle(m))}</span>`:''}</div>${own&&m.perm!=='owner'?`<div class="prow-acts"><select data-perm="${m.userId}" aria-label="권한" style="width:auto"><option value="editor" ${m.perm==='editor'?'selected':''}>편집</option><option value="viewer" ${m.perm==='viewer'?'selected':''}>보기</option></select><button class="btn sm ghost" data-act="mem-remove" data-id="${m.userId}">내보내기</button></div>`:`<span class="chip">${PERM[m.perm]}</span>`}</li>`).join('')}</ul>
  ${own?`<form id="invform" class="stack"><label class="field"><span>초대할 사람의 주소 아이디</span><input id="inv-handle" required placeholder="상대가 프로필에서 정한 아이디" autocomplete="off"></label><fieldset class="field"><legend>권한</legend><div class="choices"><label class="choice"><input type="radio" name="inv-perm" value="editor" checked><span>편집 · 작업 내용 수정</span></label><label class="choice"><input type="radio" name="inv-perm" value="viewer"><span>보기 · 열람만</span></label></div></fieldset><p class="formerr" id="inv-err" hidden></p><div class="mfoot"><button type="button" class="btn ghost" data-act="close">닫기</button><button class="btn primary" id="inv-btn">초대</button></div></form>`
  :`${p.role!=='owner'?`<div class="mfoot"><button class="btn ghost danger" data-act="leave">프로젝트에서 나가기</button><button class="btn ghost" data-act="close">닫기</button></div>`:''}`}`,m=>{
    m.querySelectorAll('[data-perm]').forEach(s=>s.addEventListener('change',async()=>{const u=s.dataset.perm;const {error}=await sb.from('project_members').update({perm:s.value}).eq('project_id',p.id).eq('user_id',u);if(error){toast('권한을 바꾸지 못했어요');return}p.members.find(x=>x.userId===u).perm=s.value;toast('권한을 바꿨어요')}));
    m.querySelector('#invform')?.addEventListener('submit',async e=>{e.preventDefault();const er=$('#inv-err');er.hidden=true;
      const h=$('#inv-handle').value.trim().replace(/^@/,'').toLowerCase();const perm=m.querySelector('[name=inv-perm]:checked').value;if(!h)return;
      busy($('#inv-btn'),true);
      const {data:pr}=await sb.from('profiles').select('id,name,handle').eq('handle',h).maybeSingle();
      const fail=t=>{busy($('#inv-btn'),false);er.textContent=t;er.hidden=false};
      if(!pr)return fail('그 아이디를 쓰는 사람이 없어요. 상대가 프로필에서 주소 아이디를 정했는지 확인해 주세요.');
      if(pr.id===me.id)return fail('본인은 이미 소유자예요.');
      if(p.members.some(x=>x.userId===pr.id))return fail('이미 참여 중인 사람이에요.');
      const {error}=await sb.from('project_members').insert({project_id:p.id,user_id:pr.id,perm});
      if(error)return fail('초대하지 못했어요. 다시 시도해 주세요.');
      p.members.push({userId:pr.id,name:pr.name||'',handle:pr.handle||'',perm});
      notify('action',`‘${p.title}’ 프로젝트에 ${PERM[perm]} 참여자로 초대됐어요`,p.id,null,pr.id);
      logAct(`‘${p.title}’에 참여자를 초대했어요`,p.id);toast('초대했어요');openMembers();
      const b=document.querySelector('[data-act="members"]');if(b)b.textContent=`참여자 ${p.members.length}`;
    });
  });
}

/* 완성 마법사 */
let wiz=null;
function openComplete(){
  const p=cur();const r=p.result||{};
  wiz={step:1,url:r.url||'',goal:r.goal||p.goal||'',period:r.period||`${fmtDate(p.created)} – ${fmtDate(now())}`,tools:r.tools||'',roles:Object.assign({},p.roles||{}),pick:new Set(p.completed?p.publicCards:p.cards.filter(c=>c.public&&c.kind!=='feedback').map(c=>c.id)),vis:p.completed?p.visibility:'public',home:p.inHome!==false};
  wizStep();
}
function wizPage(){const p=cur();return pageFromProject(p,{ids:[...wiz.pick],result:{url:wiz.url,goal:wiz.goal,period:wiz.period,tools:wiz.tools},members:pageMembers(Object.assign({},p,{roles:wiz.roles}))})}
function wizStep(){
  const p=cur(),w=wiz,s=w.step;
  const head=`<div class="eyebrow">프로젝트 완성 · ${s}/5</div><div class="steps">${[1,2,3,4,5].map(i=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div>`;
  let body='';
  if(s===1)body=`<h2>결과물과 프로젝트 정보</h2><label class="field"><span>최종 결과물 링크<em>YouTube 주소면 성과 연결 대상이 돼요</em></span><input id="w-url" type="url" value="${esc(w.url)}" placeholder="https://youtube.com/watch?v=…"></label><label class="field"><span>목표</span><textarea id="w-goal" rows="2">${esc(w.goal)}</textarea></label><div class="row2"><label class="field"><span>기간</span><input id="w-period" value="${esc(w.period)}"></label><label class="field"><span>사용 도구</span><input id="w-tools" value="${esc(w.tools)}" placeholder="Premiere Pro, CapCut"></label></div>`;
  if(s===2)body=`<h2>참여자와 표시할 역할</h2><p class="small muted">정식 기여 인증이나 자동 기여율 계산은 하지 않아요. 여기서 적은 역할이 그대로 표시돼요.</p><div class="memlist">${p.members.map(m=>`<div class="memrow"><b>${esc(dispName(m))}</b><input data-mi="${m.userId}" value="${esc(w.roles[m.userId]||'')}" placeholder="역할 (예: 촬영)" aria-label="역할"><span class="chip">${PERM[m.perm]}</span></div>`).join('')}</div>`;
  if(s===3){const groups=CHAPTERS.map(([k,l])=>[k,l,p.cards.filter(c=>chapterOf(c)===k).slice().sort(readOrder)]).filter(g=>g[2].length);
    body=`<h2>공개할 결과와 작업 과정</h2><p class="small muted">고른 카드만 공개 페이지에 복사되고, 공개 페이지에서는 기획 → 레퍼런스 → 장면표 순서로 묶여 보여요. 고르지 않은 자료는 공개 페이지에 저장되지 않아요.</p><div class="pick">${groups.map(([k,l,list])=>`<div class="pick-g"><label class="pick-h"><input type="checkbox" class="pick-all" data-g="${k}" ${list.every(c=>w.pick.has(c.id))?'checked':''}><b>${l}</b><span class="muted small" data-gn="${k}">${list.filter(c=>w.pick.has(c.id)).length}/${list.length}</span></label>${list.map(c=>`<label><input type="checkbox" data-pk="${c.id}" data-g="${k}" ${w.pick.has(c.id)?'checked':''}><span class="chip kchip k-${c.kind}">${kindLabel(c)}</span><span class="pick-t">${esc(c.title||(c.body||'').slice(0,30)||'제목 없음')}${c.media==='frame'?' · '+tc(c.t||0):''}</span>${c.public?'':'<span class="chip st-warn" style="margin-left:auto">비공개 자료</span>'}</label>`).join('')}</div>`).join('')||'<p class="muted">카드가 없어요.</p>'}</div>`}
  if(s===4)body=`<h2>자동으로 구성된 페이지 미리보기</h2><p class="small muted">수정할 부분이 있으면 이전 단계로 돌아가세요.</p><div style="max-height:420px;overflow:auto;border-radius:14px">${pubHTML(wizPage())}</div>`;
  if(s===5)body=`<h2>공개 여부</h2><div class="starts"><label class="start"><input type="radio" name="w-vis" value="public" ${w.vis==='public'?'checked':''}><span><b>공개</b><small>공개 주소로 누구나 볼 수 있어요</small></span></label><label class="start"><input type="radio" name="w-vis" value="private" ${w.vis!=='public'?'checked':''}><span><b>비공개</b><small>나와 초대한 참여자만 볼 수 있어요</small></span></label></div><label class="check"><input type="checkbox" id="w-home" ${w.home?'checked':''}><span>Creator Home에 연결<br><span class="small muted">공개로 선택한 경우에만 다른 사람에게 보여요.</span></span></label>${ownDone()>=plan().done&&p.status!=='done'?`<p class="small" style="color:var(--warn);margin:0">${plan().name} 플랜 기준안(완성 ${plan().done}개)을 넘어요. 최종 한도는 아직 확정되지 않았어요.</p>`:''}`;
  modal(`${head}${body}<div class="mfoot"><button class="btn ghost" data-act="${s===1?'close':'w-prev'}">${s===1?'취소':'이전'}</button><button class="btn primary" data-act="${s===5?'w-finish':'w-next'}" id="w-main">${s===5?'완성하고 페이지 만들기':'다음'}</button></div>`,null,s===4);
}
function wizCollect(){
  const w=wiz,s=w.step;
  if(s===1){w.url=$('#w-url').value.trim();w.goal=$('#w-goal').value.trim();w.period=$('#w-period').value.trim();w.tools=$('#w-tools').value.trim()}
  if(s===2)document.querySelectorAll('[data-mi]').forEach(el=>w.roles[el.dataset.mi]=el.value.trim());
  if(s===3){w.pick=new Set([...document.querySelectorAll('[data-pk]')].filter(el=>el.checked).map(el=>el.dataset.pk))}
  if(s===5){w.vis=document.querySelector('[name=w-vis]:checked').value;w.home=$('#w-home').checked}
}
async function wizFinish(){
  const p=cur(),w=wiz,first=p.status!=='done';
  busy($('#w-main'),true,'저장 중…');
  p.result={url:w.url,goal:w.goal,period:w.period,tools:w.tools};p.roles=w.roles;p.publicCards=[...w.pick];p.visibility=w.vis;p.inHome=w.home;p.status='done';p.completed=now();
  p.metrics=w.url&&classify(w.url)?.media==='youtube'?{status:'pending'}:null;
  markDirty(p);await flush();
  if(saveState==='failed'){busy($('#w-main'),false);return}
  await syncPublicPage(p);
  if(first){logAct(`‘${p.title}’을(를) 완성했어요`,p.id);notify('general',`‘${p.title}’ 프로젝트를 완성했어요. ${w.vis==='public'?'공개 페이지가 만들어졌어요.':'비공개로 보관돼요.'}`,p.id)}
  closeModal();wiz=null;ui.sel=null;go('public',p.id);toast(w.vis==='public'?'공개 페이지를 만들었어요':'완성했어요 · 비공개');
}

/* ---------- 공개 페이지 ---------- */
function procCard(c){
  if(c.kind==='sticky')return `<div class="proccard sticky st-${c.color||'yellow'}"><p>${esc(c.body||'')}</p></div>`;
  if(c.kind==='text')return `<div class="proccard"><h3 style="font-size:18px">${esc(c.body||'')}</h3></div>`;
  let m='';
  if(c.img)m=`<img src="${esc(c.img)}" alt="">`;
  else if(c.frames&&c.frames.length)m=`<div class="frames ${c.orient==='v'?'v':''}">${c.frames.map(f=>`<img src="${f.img}" alt="">`).join('')}</div>`;
  else if(c.media==='youtube')m=mediaHTML(c,false);
  else if(c.media==='audio'&&c.src)m=`<audio controls preload="none" src="${esc(c.src)}"></audio>`;
  return `<div class="proccard"><span class="chip kchip k-${c.kind}" style="justify-self:start">${kindLabel(c)}${c.media==='frame'?' · '+tc(c.t||0):''}</span>${m}<h3>${esc(c.title||'')}</h3>${c.body?`<p>${esc(c.body)}</p>`:''}</div>`;
}
function urlBox(url,label){return `<div class="urlbox"><code>${esc(url)}</code><button class="btn sm" data-act="copy" data-text="${esc(url)}">${label}</button></div>`}
function vPublic(p){
  const own=p.role==='owner',live=shouldPublish(p);
  return `<div class="page">
  <div class="pubbar"><button class="btn ghost sm" data-act="go" data-view="projects">← 프로젝트</button><span class="chip ${live?'st-ok':''}">${live?'공개 중':'비공개 · 나와 참여자만'}</span>${live&&p.inHome?'<span class="chip">Creator Home 연결됨</span>':''}<span style="flex:1"></span>${own?`<button class="btn sm" data-act="edit-public">공개 정보 수정</button>${p.status==='done'?`<button class="btn sm" data-act="reopen" data-id="${p.id}">다시 작업 열기</button>`:''}`:''}<button class="btn sm" data-act="peek-map" data-id="${p.id}">작업 공간 보기</button></div>
  ${live?urlBox(projUrl(p.id),'주소 복사'):''}
  ${pubHTML(pageFromProject(p))}
  ${own&&p.metrics?`<section class="panel"><div class="panelhead"><h2>성과</h2></div>${perfBlock(p)}</section>`:''}
  </div>`;
}

/* 로그인 없이 보는 공개 화면 */
function guestBar(){return `<div class="guestbar"><a class="brand" href="${BASE}" style="text-decoration:none;color:var(--ink)">${LOGO}Ballacove</a><button class="btn sm ${me?'':'primary'}" data-act="to-app">${me?'내 작업 공간으로':'로그인 · 가입'}</button></div>`}
function vGuestPage(){
  const pg=ui.pub?.pg;
  if(!pg)return `${guestBar()}<div class="page"><div class="panel empty"><h2>볼 수 없는 페이지예요</h2><p class="muted" style="margin:0">비공개로 바뀌었거나 삭제된 프로젝트예요.</p></div></div>`;
  return `${guestBar()}<div class="page">${pubHTML(pg)}<p class="small muted" style="margin:0">이 페이지에 문제가 있나요? <button class="linkbtn" data-act="report" data-id="${pg.id}">신고하기</button></p></div>`;
}
function vGuestCreator(){
  const c=ui.pub;
  if(!c?.profile)return `${guestBar()}<div class="page"><div class="panel empty"><h2>찾을 수 없는 Creator Home이에요</h2><p class="muted" style="margin:0">주소 아이디가 바뀌었을 수 있어요.</p></div></div>`;
  const pr=c.profile;
  const grid=list=>`<div class="cgrid">${list.map(pg=>`<button class="ccard" data-act="pub-open" data-id="${pg.id}"><div class="cover">${coverOf(pg)}</div><div class="cb"><h3>${esc(pg.title)}</h3><div class="small muted">${esc(pg.type)}${pg.result?.period?' · '+esc(pg.result.period):''}</div><div class="small">${esc((pg.members||[]).find(m=>m.userId===pr.id)?.role||'')}</div></div></button>`).join('')}</div>`;
  return `${guestBar()}<div class="page">
  <section class="panel profile"><div class="avatar" aria-hidden="true">${esc((pr.name||'').slice(0,1))}</div><div style="display:grid;gap:4px;min-width:0"><div class="eyebrow">CREATOR HOME</div>${pr.name?`<h1>${esc(pr.name)}</h1>`:''}<div class="small muted">@${esc(pr.handle)}</div>${pr.intro?`<p style="margin:4px 0 0">${esc(pr.intro)}</p>`:''}<div class="chips">${(pr.fields||[]).map(f=>`<span class="chip">${esc(f)}</span>`).join('')}</div></div></section>
  <section class="panel"><h2>완성한 프로젝트</h2>${c.own.length?grid(c.own):'<p class="muted" style="margin:0">아직 공개한 프로젝트가 없어요.</p>'}</section>
  ${c.joined.length?`<section class="panel"><h2>참여한 프로젝트</h2>${grid(c.joined)}</section>`:''}
  </div>`;
}
const pageFromRow=r=>({id:r.project_id,title:r.title,type:r.type,result:r.result,cards:r.cards||[],members:r.members||[],layout:r.layout||null,inHome:r.in_home});
async function showPublicProject(id){
  publicMode=true;ui.view='loading';render();
  const {data}=await sb.from('public_pages').select('*').eq('project_id',id).maybeSingle();
  ui.pub={pg:data?pageFromRow(data):null};ui.view='pubpage';render();
  if(data)document.title=`${data.title} · Ballacove`;
}
async function showPublicCreator(h){
  publicMode=true;ui.view='loading';render();
  const {data:pr}=await sb.from('profiles').select('id,name,handle,intro,fields').eq('handle',h.toLowerCase()).maybeSingle();
  let own=[],joined=[];
  if(pr){
    const [{data:a},{data:b}]=await Promise.all([
      sb.from('public_pages').select('*').eq('owner_id',pr.id).eq('in_home',true).order('published_at',{ascending:false}),
      sb.from('public_pages').select('*').contains('members',[{userId:pr.id}]).neq('owner_id',pr.id).order('published_at',{ascending:false})]);
    own=(a||[]).map(pageFromRow);joined=(b||[]).map(pageFromRow);
  }
  ui.pub={profile:pr,own,joined};ui.view='pubcreator';render();
}

/* ---------- Creator Home (내 것) ---------- */
function vCreator(){
  const pr=db.profile;
  const mine=db.projects.filter(p=>p.status==='done'&&p.role==='owner');
  const pub=mine.filter(p=>shouldPublish(p)&&p.inHome);
  const joined=db.projects.filter(p=>p.status==='done'&&p.role!=='owner'&&p.visibility==='public');
  const grid=list=>`<div class="cgrid">${list.map(p=>`<button class="ccard" data-act="open-project" data-id="${p.id}"><div class="cover">${coverOf(pageFromProject(p))}</div><div class="cb"><h3>${esc(p.title)}</h3><div class="small muted">${esc(p.type)} · ${esc(p.result?.period||fmtDate(p.completed||p.updated))}</div><div class="small">${esc((p.roles||{})[me.id]||'')}</div></div></button>`).join('')}</div>`;
  return `<div class="page">
  <section class="panel profile"><div class="avatar" aria-hidden="true">${esc((pr.name||'').slice(0,1))}</div><div style="display:grid;gap:4px;min-width:0"><div class="eyebrow">CREATOR HOME</div>${pr.name?`<h1>${esc(pr.name)}</h1>`:'<h1 class="muted" style="font-weight:500">이름이 비어 있어요</h1>'}${pr.handle?`<div class="small muted">@${esc(pr.handle)}</div>`:''}${pr.intro?`<p style="margin:4px 0 0">${esc(pr.intro)}</p>`:''}<div class="chips">${pr.fields.map(f=>`<span class="chip">${esc(f)}</span>`).join('')}</div></div><div class="pacts" style="display:grid;gap:8px;justify-items:start"><button class="btn sm" data-act="edit-profile">프로필 수정</button></div></section>

async function setPlan(userId,planKey){
  const {error}=await sb.from('profiles').update({plan:planKey}).eq('id',userId);

  const r=adminRows&&!adminRows.error&&adminRows.find(x=>x.id===userId);if(r)r.plan=planKey;
  if(ui.view==='admin')render();

function openReport(pid){

  modal(`<h2>신고하기</h2><form id="rpform" class="stack"><label class="field"><span>사유</span><select id="rp-why"><option>도용·무단 사용</option><option>소유권 분쟁</option><option>괴롭힘·혐오 표현</option><option>스팸·광고</option><option>기타</option></select></label><label class="field"><span>설명</span><textarea id="rp-desc" rows="3" required placeholder="어떤 부분이 문제인지 적어 주세요"></textarea></label><label class="field"><span>근거 링크<em>스크린샷을 올린 주소나 원본 주소</em></span><input id="rp-link" type="url" placeholder="https://"></label><p class="small muted">접수하면 사건번호가 생기고, 접수됨 → 검토 중 → 처리 완료 순서로 알려 드려요. 결과에 대해 한 번 재검토를 요청할 수 있어요.</p><div class="mfoot"><button type="button" class="btn ghost" data-act="close">취소</button><button class="btn primary" id="rp-btn">신고 접수</button></div></form>`,m=>{

      if(error){busy($('#rp-btn'),false);toast('신고를 접수하지 못했어요. 다시 시도해 주세요.');return}
      if(started)notify('general',`신고 ${no}가 접수됐어요. 검토가 시작되면 알려 드릴게요.`,null);
      modal(`<h2>신고가 접수됐어요</h2><p>사건번호 <b class="mono">${no}</b></p><div class="casesteps"><span class="on">접수됨</span><span>검토 중</span><span>처리 완료</span></div><p class="small muted">처리 결과에는 판단 이유를 함께 안내하고, 상대방 개인정보와 상세 제재 내용은 보호해요.</p><div class="mfoot"><button class="btn primary" data-act="close">확인</button></div>`)})});
