<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ballacove</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<style>
/* 기본 리셋: 단독 실행 시에도 hidden 속성이 항상 숨김으로 동작하도록 */
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
.hint .btn{pointer-events:auto}

/* 레이아웃: 왼쪽 내비 + 작업 영역. Cove Map은 점 격자 캔버스 위에 카드와 연결선. 강조색은 만(cove)의 깊은 청록 하나, 카드 종류색은 의미 표시용. */
:root{
  --bg:#EDF1F0; --surface:#FBFCFC; --sunk:#E2E8E7; --ink:#14201E; --muted:#56635F; --line:#CBD5D3; --dot:#BFCAC8;
  --accent:#0D6B66; --accent-ink:#F2FAF9; --accent-soft:#D2E7E4;
  --k-idea:#9A6410; --k-intro:#B54A26; --k-ref:#2C5AA0; --k-scene:#0D6B66; --k-feedback:#74469E; --k-memo:#5F6B69;
  --ok:#2A7A4B; --warn:#9A6410; --bad:#B03535;
  --shadow:0 1px 2px rgba(20,32,30,.07),0 6px 18px rgba(20,32,30,.07);
  --f-display:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1716; --surface:#17211F; --sunk:#0B1211; --ink:#E3EBE9; --muted:#97A6A3; --line:#2B3A37; --dot:#26332F;
  --accent:#55B8AE; --accent-ink:#062220; --accent-soft:#173C38;
  --k-idea:#E2AA4C; --k-intro:#EC8661; --k-ref:#86A8E2; --k-scene:#55B8AE; --k-feedback:#BC98DC; --k-memo:#9CA8A6;
  --ok:#5FC28C; --warn:#E2AA4C; --bad:#E57373; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1716; --surface:#17211F; --sunk:#0B1211; --ink:#E3EBE9; --muted:#97A6A3; --line:#2B3A37; --dot:#26332F;
  --accent:#55B8AE; --accent-ink:#062220; --accent-soft:#173C38;
  --k-idea:#E2AA4C; --k-intro:#EC8661; --k-ref:#86A8E2; --k-scene:#55B8AE; --k-feedback:#BC98DC; --k-memo:#9CA8A6;
  --ok:#5FC28C; --warn:#E2AA4C; --bad:#E57373; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:12.5px}

#app{display:grid;grid-template-columns:224px minmax(0,1fr);height:100%}
.side{border-right:1px solid var(--line);padding-block:20px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:22px;overflow:auto}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em;padding-inline:8px}
.brand svg{width:26px;height:26px}
.navlist{display:flex;flex-direction:column;gap:2px}
.navbtn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:0;background:none;color:var(--muted);font-weight:500;cursor:pointer;text-align:left}
.navbtn:hover{background:var(--sunk);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.navbtn svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.badge{margin-left:auto;background:var(--accent);color:var(--accent-ink);font-size:11px;font-family:var(--f-mono);padding:0 7px;border-radius:99px;line-height:18px}
.plan{margin-top:auto;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding:14px 8px 0;display:grid;gap:7px}
.plan b{color:var(--ink);font-weight:600}
.meter{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}.meter>i{display:block;height:100%;background:var(--accent)}
.planrow{display:flex;justify-content:space-between;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tabbar{display:none}
main{min-width:0;min-height:0;overflow:auto;position:relative}

.page{max-width:1060px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px;align-content:start}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:27px;line-height:1.25;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:16.5px;margin:0;letter-spacing:-.01em}
h3{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.04em;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:14px;align-content:start;min-width:0}
.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap;border:0;line-height:1.5}
button.chip{cursor:pointer}
.kchip{color:var(--k);background:color-mix(in srgb,var(--k) 13%,transparent);font-weight:600}
.k-idea{--k:var(--k-idea)}.k-intro{--k:var(--k-intro)}.k-ref{--k:var(--k-ref)}.k-scene{--k:var(--k-scene)}.k-feedback{--k:var(--k-feedback)}.k-memo{--k:var(--k-memo)}
.st-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.st-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.st-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* 작업 홈 */
.continue{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:20px;align-items:center}
.continue h2{font-size:22px;font-weight:800}
.continue .lede{margin:0;color:var(--muted);max-width:52ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.mini{width:100%;height:auto;display:block;background:var(--bg);border-radius:8px;border:1px solid var(--line)}
.rows{display:grid}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0;padding-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row button.t{border:0;background:none;padding:0;cursor:pointer;text-align:left;max-width:100%}
.row button.t:hover{color:var(--accent)}
.bar{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:5px;max-width:240px}.bar i{display:block;height:100%;background:var(--accent)}
.act{font-size:13px}.act time{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.metric{display:grid;gap:2px}.metric span{font-size:12px;color:var(--muted)}.metric b{font-family:var(--f-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.metric b.na{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:400}
.perf{display:grid;gap:12px;padding-top:14px;border-top:1px solid var(--line)}
.perf:first-of-type{border-top:0;padding-top:0}
.empty{display:grid;justify-items:start;gap:10px;padding:28px}

/* 프로젝트 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 12px;color:var(--muted);font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .mono{font-size:12px;margin-left:4px}
.plist{display:grid;gap:10px}
.prow{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;flex-wrap:wrap}
.prow-main{flex:1 1 260px;min-width:0;display:flex;gap:14px;align-items:center;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.prow-main .mini{width:96px;flex:none}
.prow-main:hover h3{color:var(--accent)}
.prow h3{font-size:15.5px;font-weight:600;margin-bottom:4px}
.prow-acts{display:flex;gap:6px;flex-wrap:wrap}
.trashlink{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Cove Map */
.mapview{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.maptop{display:flex;align-items:center;gap:8px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.maptitle{font-family:var(--f-display);font-weight:700;font-size:16.5px;border:1px solid transparent;background:none;min-width:0;flex:1 1 150px;padding:4px 8px;border-radius:6px}
.maptitle:hover:not([readonly]),.maptitle:focus{border-color:var(--line);background:var(--bg)}
.savestate{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.savestate i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.savestate.saving i{background:var(--warn)} .savestate.failed{color:var(--bad)} .savestate.failed i{background:var(--bad)}
.savestate.failed .linkbtn{color:var(--bad)}
.topacts{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.mapbody{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;min-height:0}
.stage{position:relative;overflow:hidden;touch-action:none;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.3px);cursor:grab;min-height:0}
.stage.panning{cursor:grabbing}
.stage.dropping{box-shadow:inset 0 0 0 3px var(--accent)}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.wires{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.wires path{fill:none;stroke:var(--muted);stroke-width:1.6;opacity:.55}
.wires circle{fill:var(--muted);opacity:.7}
.card{position:absolute;width:220px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;box-shadow:var(--shadow);cursor:grab;user-select:none;-webkit-user-select:none;display:grid;gap:7px}
.card.sel{outline:2px solid var(--accent);outline-offset:1px}
.card.linksrc{outline:2px dashed var(--accent);outline-offset:2px}
.card.dragging{cursor:grabbing;box-shadow:0 14px 30px rgba(0,0,0,.18);z-index:3}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:6px}
.card h3{font-size:14px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.card p{margin:0;color:var(--muted);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card img{display:block;width:100%;border-radius:6px;pointer-events:none}
.who,.due{font-size:11.5px;font-family:var(--f-mono);color:var(--muted)}
.due.over{color:var(--bad)}
.frames{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.frames img,.frames figure img{aspect-ratio:16/9;object-fit:cover;border-radius:3px;width:100%;display:block}
.frames.v img{aspect-ratio:9/16}
.frames figure{margin:0;display:grid;gap:2px}
.frames figcaption{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-align:center}
.note{font-size:11.5px;color:var(--muted)}
.yt{aspect-ratio:16/9;border-radius:6px;background:linear-gradient(135deg,color-mix(in srgb,var(--k-intro) 70%,#000),color-mix(in srgb,var(--k-intro) 40%,#000));display:grid;place-items:center;color:#fff;position:relative}
.yt svg{width:34px;height:34px;opacity:.92}
.yt span{position:absolute;left:8px;bottom:6px;font-size:11px;font-family:var(--f-mono);opacity:.85}
.linkline{font-family:var(--f-mono);font-size:11.5px;color:var(--k-ref);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--bg)}
.filebox{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:7px 8px;background:var(--bg);min-width:0}
.filebox b{font-family:var(--f-mono);font-size:11px;background:var(--k-ref);color:var(--surface);border-radius:4px;padding:2px 5px;flex:none}
.filebox span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.proc{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:10px;flex-wrap:wrap}
.proc.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.zoomctl{position:absolute;right:12px;top:12px;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);overflow:hidden}
.zoomctl button{border:0;background:none;padding:6px 10px;cursor:pointer;color:var(--ink)}
.zoomctl button:hover{background:var(--sunk)}
.zoomctl span{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:44px;text-align:center}
.toolbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:2px;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none}
.toolbar button{border:0;background:none;padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;font-size:13px;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.toolbar button:hover{background:var(--sunk)}
.toolbar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toolbar .dot{width:8px;height:8px;border-radius:50%;background:var(--k)}
.toolbar .sep{width:1px;background:var(--line);margin:4px 3px;flex:none}
.linkbanner{position:absolute;top:12px;left:12px;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:7px 12px;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);max-width:calc(100% - 200px)}
.linkbanner button{border:0;background:rgba(255,255,255,.18);color:inherit;border-radius:6px;padding:2px 8px;cursor:pointer}
.hint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;padding:16px}
.hint div{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px 22px;max-width:360px;text-align:center;display:grid;gap:6px;color:var(--muted);font-size:13px}
.hint b{color:var(--ink);font-family:var(--f-display);font-size:16px}
.detail{width:330px;border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding:16px;display:grid;gap:14px;align-content:start}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.field{display:grid;gap:5px;border:0;padding:0;margin:0;min-width:0}
.field>span,.field>legend{font-size:12.5px;color:var(--muted);font-weight:500;padding:0}
.field em{font-style:normal;color:var(--muted);font-weight:400;margin-left:4px;font-size:12px}
input:not([type=checkbox]):not([type=radio]):not([type=file]),textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{resize:vertical;line-height:1.5}
input[type=file]{font-size:13px;max-width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;font-size:12.5px}
.meta dt{color:var(--muted)} .meta dd{margin:0;overflow-wrap:anywhere}
.linked{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent)}
.dacts{display:flex;flex-wrap:wrap;gap:6px;padding-top:12px;border-top:1px solid var(--line)}

/* 모달 */
#modal[hidden]{display:none}
.modal-back{position:fixed;inset:0;background:rgba(8,18,16,.48);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;width:min(580px,100%);max-height:calc(100% - 24px);overflow:auto;padding:22px;display:grid;gap:16px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.modal.wide{width:min(760px,100%)}
.modal p{margin:0}
.stack{display:grid;gap:14px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{position:relative;cursor:pointer}
.choice input,.start input{position:absolute;opacity:0;pointer-events:none}
.choice span{display:block;padding:6px 12px;border:1px solid var(--line);border-radius:99px;font-size:13px}
.choice input:checked+span,.start input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.choice input:focus-visible+span,.start input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.starts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.start{position:relative;cursor:pointer}
.start span{display:grid;gap:2px;border:1px solid var(--line);border-radius:10px;padding:12px;height:100%}
.start small{color:var(--muted);font-size:12px}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps i{flex:1 1 40px;height:4px;border-radius:2px;background:var(--sunk)}
.steps i.on{background:var(--accent)}
.pick{display:grid;gap:6px;max-height:300px;overflow:auto}
.pick label{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.pick input{accent-color:var(--accent)}
.vlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.vlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;flex-wrap:wrap}
.vlist li>div{display:grid;min-width:0}
.vlist .muted{font-size:12px}
.inline{display:flex;gap:8px;flex-wrap:wrap}.inline input{flex:1 1 200px}
.memlist{display:grid;gap:8px}
.memrow{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:8px;align-items:center}
.casesteps{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px}
.casesteps span{padding:4px 10px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.casesteps span.on{background:var(--accent);color:var(--accent-ink)}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translateX(-50%)}

/* 공개 페이지 · Creator Home */
.pubbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pub{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid}
.pub-hero{padding:28px 28px 22px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.pub-hero h1{font-size:32px}
.pub-hero .lede{margin:0;color:var(--muted);font-size:15px;max-width:58ch}
.pub-by{font-size:13px;color:var(--muted)}
.pub-sec{padding:22px 28px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.pub-sec:last-child{border-bottom:0}
.pub-result{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px;align-items:center;text-decoration:none;color:var(--ink)}
.pub-result b{display:block;font-size:15px}
.pub-result small{color:var(--muted);font-family:var(--f-mono)}
.roles{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.roles li{border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:grid}
.roles span{font-size:12.5px;color:var(--muted)}
.procgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.proccard{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:7px;align-content:start;background:var(--bg)}
.proccard h3{font-size:14px;font-weight:600}
.proccard p{margin:0;font-size:12.5px;color:var(--muted)}
.proccard img{width:100%;border-radius:6px;display:block}
.profile{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:28px}
.profile h1{font-size:26px}
.urlbox{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:6px 6px 6px 12px;background:var(--bg);max-width:420px}
.urlbox code{font-family:var(--f-mono);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:all}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ccard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);display:grid;text-align:left;padding:0;cursor:pointer}
.ccard:hover{border-color:var(--accent)}
.ccard .cover{aspect-ratio:16/9;background:var(--bg);overflow:hidden;border-bottom:1px solid var(--line)}
.ccard .cover img{width:100%;height:100%;object-fit:cover;display:block}
.ccard .cover .mini{border:0;border-radius:0;height:100%}
.ccard div.cb{padding:12px 14px;display:grid;gap:4px}
.ccard h3{font-size:15px;font-weight:600}
.notif{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.notif:first-of-type{border-top:0}
.notif .pip{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:transparent}
.notif.unread .pip{background:var(--accent)}
.notif .grow{flex:1;min-width:0;display:grid;gap:2px}
.notif time{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.notif.alert .pip{background:var(--bad)}
.notif:not(.unread) .txt{color:var(--muted)}

@media (max-width:760px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .side{display:none}
  .tabbar{display:flex;border-top:1px solid var(--line);background:var(--surface);padding-bottom:0;padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
  .tabbar button{flex:1;border:0;background:none;display:grid;justify-items:center;gap:2px;padding:7px 2px 6px;font-size:11px;color:var(--muted);cursor:pointer;position:relative}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .tabbar svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tabbar .badge{position:absolute;top:3px;left:calc(50% + 6px);margin:0;font-size:10px;padding:0 5px;line-height:15px}
  h1{font-size:23px}
  .continue{grid-template-columns:minmax(0,1fr)}
  .detail{position:absolute;left:0;right:0;bottom:0;width:auto;max-height:62%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);z-index:6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topacts .btn{padding:5px 8px}
  .linkbanner{max-width:calc(100% - 24px);top:58px}
  .pub-hero,.pub-sec{padding-left:18px;padding-right:18px}
  .pub-hero h1{font-size:25px}
  .pub-result{grid-template-columns:minmax(0,1fr)}
  .profile{grid-template-columns:auto minmax(0,1fr)}
  .profile>.pacts{grid-column:1/-1}
  .starts{grid-template-columns:minmax(0,1fr)}
  .memrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .memrow>span{grid-column:1/-1}
  .prow-main .mini{width:72px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 로그인·공개 화면 */
#app.guest{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
#app.guest .side,#app.guest .tabbar{display:none}
.authwrap{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.authcard{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:16px;box-shadow:var(--shadow)}
.authcard .brand{padding:0}
.formerr{color:var(--bad);font-size:13px;margin:0}
.formok{color:var(--ok);font-size:13px;margin:0}
.guestbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:4}
.guestbar .brand{padding:0;font-size:17px}.guestbar .brand svg{width:22px;height:22px}
.loading{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);gap:10px}
.account{display:grid;gap:4px;margin-top:6px;overflow-wrap:anywhere}
</style>

<body>
<div id="app" class="guest">
  <aside class="side">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 18a12 12 0 0 1 24 0" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/><path d="M4 23c3-2.4 5.3-2.4 8 0s5.3 2.4 8 0 5.3-2.4 8 0" fill="none" stroke="var(--k-ref)" stroke-width="2.4" stroke-linecap="round"/></svg>Ballacove</div>
    <nav class="navlist" id="nav"></nav>
    <div class="plan" id="plan"></div>
  </aside>
  <main id="main"><div class="loading"><span class="spin"></span><span>불러오는 중</span></div></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ---------- Supabase ---------- */
const SUPABASE_URL='https://stbnlohykesgkoniiifc.supabase.co';
const SUPABASE_KEY='sb_publishable_2g5UHihRAnmg7z5ORUT28g_5F3fd8yh';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const BASE=location.origin+location.pathname;

const DAY=864e5;
const $=s=>document.querySelector(s);
const now=()=>Date.now();
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmtDate=t=>{const d=new Date(t);return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`};
const clock=t=>{const d=new Date(t);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fmtDT=t=>`${fmtDate(t)} ${clock(t)}`;
const isoDate=t=>{const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const ts=v=>v?new Date(v).getTime():null;
const iso=v=>v?new Date(v).toISOString():null;
function rel(t){const s=(now()-t)/1000;if(s<60)return '방금';if(s<3600)return `${Math.floor(s/60)}분 전`;if(s<86400)return `${Math.floor(s/3600)}시간 전`;if(s<86400*30)return `${Math.floor(s/86400)}일 전`;return fmtDate(t)}
function dDay(t){const d=Math.round((sod(t)-sod(now()))/DAY);return d>0?`D-${d}`:d===0?'오늘 마감':`${-d}일 지남`}
const tc=s=>`${pad(Math.floor(s/60))}:${pad(Math.floor(s%60))}`;

const KIND={idea:'아이디어·기획',intro:'도입부',ref:'참고자료',scene:'장면',feedback:'피드백·일정',memo:'메모'};
const MEDIA={image:'이미지',video:'영상',youtube:'YouTube',link:'웹 링크',pdf:'PDF',doc:'문서',psd:'PSD',tool:'외부 도구'};
const TYPES=['숏폼','YouTube','브랜드 영상','자유 작업'];
const PERM={owner:'소유자',editor:'편집',viewer:'보기'};
const kindLabel=c=>c.kind==='ref'&&c.media?`${MEDIA[c.media]}`:KIND[c.kind];
const LOGO='<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 18a12 12 0 0 1 24 0" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/><path d="M4 23c3-2.4 5.3-2.4 8 0s5.3 2.4 8 0 5.3-2.4 8 0" fill="none" stroke="var(--k-ref)" stroke-width="2.4" stroke-linecap="round"/></svg>';

/* ---------- 상태 ---------- */
let me=null,started=false,publicMode=false;
const emptyDb=()=>({profile:{name:'',handle:'',intro:'',fields:[]},projects:[],trash:[],notifications:[],activity:[]});
let db=emptyDb();
const ui={view:'loading',pid:null,tab:'active',sel:null,linkFrom:null,pub:null,authMode:'login',err:''};
const hist={};
let demo=null;
const hintClosed=new Set();
const cur=()=>ui.pid==='demo'?demo:db.projects.find(p=>p.id===ui.pid);
const proj=id=>id==='demo'?demo:db.projects.find(p=>p.id===id);
const anyProj=id=>db.projects.find(p=>p.id===id)||db.trash.find(p=>p.id===id);
const ownActive=()=>db.projects.filter(p=>p.status==='active'&&p.role==='owner').length;
const ownDone=()=>db.projects.filter(p=>p.status==='done'&&p.role==='owner').length;
const isMe=m=>me&&m.userId===me.id;
const memName=m=>isMe(m)?db.profile.name:m.name;
const memHandle=m=>isMe(m)?db.profile.handle:m.handle;
const dispName=m=>memName(m)||(memHandle(m)?'@'+memHandle(m):'프로필 미설정');

/* ---------- DB ↔ 화면 데이터 ---------- */
function fromRow(r,mems,profs){
  const d=r.data||{};
  const perm=r.owner_id===me.id?'owner':(mems.find(m=>m.project_id===r.id&&m.user_id===me.id)?.perm||'viewer');
  const pm=(u,pr)=>({userId:u,name:profs[u]?.name||'',handle:profs[u]?.handle||'',perm:pr});
  return {id:r.id,ownerId:r.owner_id,role:perm,owner:profs[r.owner_id]?.name||'',
    title:r.title,type:r.type,status:r.status,visibility:r.visibility,inHome:r.in_home,due:ts(r.due),goal:r.goal||'',
    result:r.result,publicCards:r.public_cards||[],metrics:r.metrics,
    cards:d.cards||[],links:d.links||[],shelf:d.shelf||[],versions:d.versions||[],roles:d.roles||{},
    members:[pm(r.owner_id,'owner'),...mems.filter(m=>m.project_id===r.id).map(m=>pm(m.user_id,m.perm))],
    created:ts(r.created_at),updated:ts(r.updated_at),completed:ts(r.completed_at),deletedAt:ts(r.deleted_at)};
}
function toRow(p){return {title:p.title,type:p.type,status:p.status,visibility:p.visibility,in_home:!!p.inHome,due:iso(p.due),goal:p.goal||'',
  result:p.result||null,public_cards:p.publicCards||[],metrics:p.metrics||null,
  data:{cards:p.cards,links:p.links,shelf:p.shelf,versions:p.versions,roles:p.roles||{}},
  updated_at:iso(p.updated||now()),completed_at:iso(p.completed),deleted_at:iso(p.deletedAt)}}

async function loadAll(){
  const [{data:prof,error:e0},{data:myMem,error:e1}]=await Promise.all([
    sb.from('profiles').select('*').eq('id',me.id).maybeSingle(),
    sb.from('project_members').select('project_id').eq('user_id',me.id)]);
  if(e0)throw e0;if(e1)throw e1;
  const memberIds=(myMem||[]).map(m=>m.project_id);
  let q=sb.from('projects').select('*');
  q=memberIds.length?q.or(`owner_id.eq.${me.id},id.in.(${memberIds.join(',')})`):q.eq('owner_id',me.id);
  const [{data:rows,error:e2},{data:nts},{data:acts}]=await Promise.all([
    q.order('updated_at',{ascending:false}),
    sb.from('notifications').select('*').eq('user_id',me.id).order('created_at',{ascending:false}).limit(60),
    sb.from('activity').select('*').eq('user_id',me.id).order('created_at',{ascending:false}).limit(30)]);
  if(e2)throw e2;
  const pids=(rows||[]).map(r=>r.id);
  let mems=[];if(pids.length){const {data}=await sb.from('project_members').select('*').in('project_id',pids);mems=data||[]}
  const uids=[...new Set([...(rows||[]).map(r=>r.owner_id),...mems.map(m=>m.user_id)])];
  const profs={};if(uids.length){const {data}=await sb.from('profiles').select('id,name,handle').in('id',uids);(data||[]).forEach(p=>profs[p.id]=p)}
  db=emptyDb();
  if(prof)db.profile={name:prof.name||'',handle:prof.handle||'',intro:prof.intro||'',fields:prof.fields||[]};
  const cutoff=now()-30*DAY;
  for(const r of rows||[]){const p=fromRow(r,mems,profs);
    if(p.deletedAt){if(p.role!=='owner')continue;if(p.deletedAt<cutoff){sb.from('projects').delete().eq('id',p.id).then(()=>{});continue}db.trash.push(p)}else db.projects.push(p)}
  db.notifications=(nts||[]).map(n=>({id:n.id,kind:n.kind,text:n.text,pid:n.project_id,cid:n.card_id,at:ts(n.created_at),read:n.read}));
  db.activity=(acts||[]).map(a=>({at:ts(a.created_at),text:a.text,pid:a.project_id}));
}

/* ---------- 저장 ---------- */
const dirty=new Set();
let saveState='saved',saveTimer=null,lastSaved=now(),saving=false;
function markDirty(p){if(!p||p.demo||p.role==='viewer')return;p.updated=now();dirty.add(p.id);saveState='saving';paintSave();clearTimeout(saveTimer);saveTimer=setTimeout(flush,900)}
function changed(){markDirty(cur())}
async function flush(){
  clearTimeout(saveTimer);
  if(saving){saveTimer=setTimeout(flush,500);return}
  if(!dirty.size){return}
  saving=true;const ids=[...dirty];dirty.clear();let ok=true;
  for(const id of ids){const p=anyProj(id);if(!p)continue;const {error}=await sb.from('projects').update(toRow(p)).eq('id',id);if(error){ok=false;dirty.add(id);console.error(error)}}
  saving=false;
  if(!ok){saveState='failed';toast('저장하지 못했어요. 인터넷 연결을 확인한 뒤 다시 시도하세요.')}
  else if(dirty.size){saveState='saving';saveTimer=setTimeout(flush,600)}
  else{saveState='saved';lastSaved=now()}
  paintSave();
}
window.addEventListener('beforeunload',e=>{if(dirty.size||saving){e.preventDefault();e.returnValue=''}});
function paintSave(){const el=$('#savestate');if(!el)return;el.className='savestate '+saveState;
  el.innerHTML=saveState==='saving'?'<i></i>저장 중…':saveState==='failed'?'<i></i><button class="linkbtn" data-act="save-retry">저장 실패 · 다시 시도</button>':`<i></i>저장됨 ${clock(lastSaved)}`}

async function notify(kind,text,pid,cid,userId){
  const target=userId||me.id;
  const {data,error}=await sb.from('notifications').insert({user_id:target,kind,text,project_id:pid&&pid!=='demo'?pid:null,card_id:cid||null}).select().single();
  if(error){console.error(error);return}
  if(target===me.id){db.notifications.unshift({id:data.id,kind,text,pid,cid,at:ts(data.created_at),read:false});paintChrome();if(ui.view==='inbox')render()}
}
function logAct(text,pid){if(pid==='demo')return;db.activity.unshift({at:now(),text,pid});db.activity=db.activity.slice(0,30);sb.from('activity').insert({text,project_id:pid||null}).then(({error})=>error&&console.error(error))}

/* 공개 페이지: 고른 카드만 따로 복사해 둔다. 비공개 자료는 이 표에 들어가지 않는다. */
const pubResult=p=>{const r=p.result||{};return {url:r.url||'',goal:r.goal||'',period:r.period||'',tools:r.tools||''}};
function pageCards(p){return (p.publicCards||[]).map(id=>p.cards.find(c=>c.id===id)).filter(Boolean).map(c=>({id:c.id,kind:c.kind,media:c.media||null,title:c.title||'',body:c.body||'',img:c.img||null,frames:c.frames||null,orient:c.orient||null,url:c.media==='youtube'?c.url:null,host:c.host||null}))}
function pageMembers(p){return p.members.map(m=>({userId:m.userId,name:memName(m)||'',handle:memHandle(m)||'',role:(p.roles||{})[m.userId]||'',owner:m.perm==='owner'}))}
function pageFromProject(p){return {id:p.id,title:p.title,type:p.type,result:pubResult(p),cards:pageCards(p),members:pageMembers(p)}}
const shouldPublish=p=>p.completed&&p.visibility==='public'&&!p.deletedAt&&p.status!=='archived';
async function syncPublicPage(p){
  if(p.role!=='owner')return;
  if(shouldPublish(p)){
    const pg=pageFromProject(p);
    const {error}=await sb.from('public_pages').upsert({project_id:p.id,owner_id:p.ownerId,title:pg.title,type:pg.type,result:pg.result,cards:pg.cards,members:pg.members,in_home:!!p.inHome,published_at:new Date().toISOString()});
    if(error){console.error(error);toast('공개 페이지를 저장하지 못했어요')}
  }else{await sb.from('public_pages').delete().eq('project_id',p.id)}
}

/* ---------- 공통 UI ---------- */
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2800)}
let pendingOk=null;
function modal(html,mount,wide){const m=$('#modal');m.innerHTML=`<div class="modal-back" data-act="close-back"><div class="modal${wide?' wide':''}" role="dialog" aria-modal="true">${html}</div></div>`;m.hidden=false;mount&&mount(m);const f=m.querySelector('input:not([type=radio]):not([type=checkbox]):not([disabled]),textarea');(f||m.querySelector('button'))?.focus()}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';pendingOk=null}
function confirmBox(title,text,ok,danger,fn){pendingOk=fn;modal(`<h2>${esc(title)}</h2><p class="muted">${text}</p><div class="mfoot"><button class="btn ghost" data-act="close">취소</button><button class="btn ${danger?'danger':'primary'}" data-act="ok">${esc(ok)}</button></div>`)}
function busy(btn,on,label){if(!btn)return;if(on){btn.dataset.label=btn.textContent;btn.disabled=true;btn.textContent=label||'처리 중…'}else{btn.disabled=false;btn.textContent=btn.dataset.label||btn.textContent}}

const IC={

function miniMap(p,w=260,h=150){
  const cs=p.cards||[];
  if(!cs.length)return `<svg class="mini" viewBox="0 0 ${w} ${h}" aria-hidden="true"><text x="${w/2}" y="${h/2+4}" text-anchor="middle" style="fill:var(--muted);font-size:12px">빈 캔버스</text></svg>`;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;cs.forEach(c=>{x0=Math.min(x0,c.x);y0=Math.min(y0,c.y);x1=Math.max(x1,c.x+220);y1=Math.max(y1,c.y+120)});
  const s=Math.min((w-20)/(x1-x0),(h-20)/(y1-y0));const ox=(w-(x1-x0)*s)/2,oy=(h-(y1-y0)*s)/2;
  const P=c=>({x:ox+(c.x-x0)*s,y:oy+(c.y-y0)*s});
  const lines=(p.links||[]).map(([a,b])=>{const A=cs.find(c=>c.id===a),B=cs.find(c=>c.id===b);if(!A||!B)return'';const pa=P(A),pb=P(B);return `<line x1="${pa.x+110*s}" y1="${pa.y+50*s}" x2="${pb.x+110*s}" y2="${pb.y+50*s}" style="stroke:var(--muted);stroke-width:1;opacity:.5"/>`}).join('');
  return `<svg class="mini" viewBox="0 0 ${w} ${h}" aria-hidden="true">${lines}${cs.map(c=>{const q=P(c);return `<rect x="${q.x}" y="${q.y}" width="${220*s}" height="${100*s}" rx="${Math.max(2,8*s)}" style="fill:var(--surface);stroke:var(--k-${c.kind});stroke-width:1.5"/>`}).join('')}</svg>`;
}
function progressText(p){const n=k=>p.cards.filter(c=>c.kind===k).length;return [['장면',n('scene')],['자료',n('ref')],['피드백',n('feedback')]].filter(x=>x[1]).map(x=>`${x[0]} ${x[1]}`).join(' · ')||'아직 카드 없음'}
function progressPct(p){const sc=p.cards.filter(c=>c.kind==='scene').length,fb=p.cards.filter(c=>c.kind==='feedback').length;return clamp(Math.round(15+sc*15+p.cards.filter(c=>c.kind==='ref').length*5-fb*4),5,95)}
function coverOf(pg){for(const c of pg.cards||[]){if(c.img)return `<img src="${c.img}" alt="">`;if(c.frames&&c.frames.length)return `<img src="${c.frames[2]?.img||c.frames[0].img}" alt="">`}return miniMap({cards:(pg.cards||[]).map((c,i)=>({kind:c.kind,x:(i%3)*260,y:Math.floor(i/3)*160})),links:[]},320,180)}

function vAuth(){

  return `<div class="authwrap"><div class="authcard">

  <form id="authform" class="stack" novalidate>
    <label class="field"><span>이메일</span><input id="au-email" type="email" autocomplete="email" required></label>
    ${m!=='reset'?`<label class="field"><span>비밀번호${m==='signup'?'<em>8자 이상</em>':''}</span><input id="au-pw" type="password" autocomplete="${m==='signup'?'new-password':'current-password'}" required></label>`:''}
    <p class="formerr" id="au-err" hidden></p><p class="formok" id="au-ok" hidden></p>
    <button class="btn primary" type="submit" id="au-btn">${m==='signup'?'가입하기':m==='reset'?'재설정 링크 보내기':'로그인'}</button>
  </form>
  <div class="small" style="display:flex;gap:14px;flex-wrap:wrap">${m==='login'?`<button class="linkbtn" data-act="auth-mode" data-m="signup">처음이세요? 가입하기</button><button class="linkbtn" data-act="auth-mode" data-m="reset">비밀번호를 잊었어요</button>`:`<button class="linkbtn" data-act="auth-mode" data-m="login">로그인으로 돌아가기</button>`}</div>
  </div></div>`;
}
function authErr(msg){const map=[[/Invalid login credentials/i,'이메일 또는 비밀번호가 맞지 않아요.'],[/Email not confirmed/i,'메일함에서 인증 링크를 먼저 눌러 주세요.'],[/already registered|already exists/i,'이미 가입된 이메일이에요. 로그인해 주세요.'],[/Password should be at least/i,'비밀번호는 8자 이상으로 정해 주세요.'],[/rate limit|too many/i,'요청이 너무 많아요. 잠시 뒤 다시 시도해 주세요.'],[/valid email|invalid format/i,'이메일 주소 형식을 확인해 주세요.']];for(const[r,t]of map)if(r.test(msg))return t;return msg}
function mountAuth(){
  const f=$('#authform');if(!f)return;
  f.addEventListener('submit',async e=>{e.preventDefault();
    const email=$('#au-email').value.trim(),pw=$('#au-pw')?.value||'';const err=$('#au-err'),ok=$('#au-ok'),btn=$('#au-btn');
    err.hidden=true;ok.hidden=true;
    if(!/^\S+@\S+\.\S+$/.test(email)){err.textContent='이메일 주소 형식을 확인해 주세요.';err.hidden=false;return}
    if(ui.authMode==='signup'&&pw.length<8){err.textContent='비밀번호는 8자 이상으로 정해 주세요.';err.hidden=false;return}
    if(ui.authMode==='login'&&!pw){err.textContent='비밀번호를 입력해 주세요.';err.hidden=false;return}
    busy(btn,true);
    let res;
    if(ui.authMode==='login')res=await sb.auth.signInWithPassword({email,password:pw});
    else if(ui.authMode==='signup')res=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:BASE}});
    else res=await sb.auth.resetPasswordForEmail(email,{redirectTo:BASE});
    busy(btn,false);
    if(res.error){err.textContent=authErr(res.error.message);err.hidden=false;return}
    if(ui.authMode==='signup'&&!res.data.session){ok.textContent=`${email}로 인증 메일을 보냈어요. 메일의 링크를 누르면 바로 시작할 수 있어요.`;ok.hidden=false}
    if(ui.authMode==='reset'){ok.textContent='재설정 링크를 보냈어요. 메일의 링크를 누르면 새 비밀번호를 정할 수 있어요.';ok.hidden=false}
  });
}
function openNewPassword(){
  modal(`<h2>새 비밀번호 정하기</h2><form id="npwform" class="stack" novalidate><label class="field"><span>새 비밀번호<em>8자 이상</em></span><input id="npw" type="password" autocomplete="new-password" required></label><p class="formerr" id="npw-err" hidden></p><div class="mfoot"><button class="btn primary" id="npw-btn">저장</button></div></form>`,m=>{

function perfBlock(p){

/* 파일 처리 */
function baseName(n){return n.replace(/\.[^.]+$/,'')}
function downscale(file,max){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.8))};im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('이미지를 열 수 없어요'))};im.src=url})}
function seek(v,t){return new Promise((res,rej)=>{const to=setTimeout(()=>rej(new Error('장면을 읽는 데 시간이 너무 오래 걸려요')),9000);v.onseeked=()=>{clearTimeout(to);res()};v.currentTime=t})}
async function extractFrames(file,c){
  const pid=ui.pid;c.procState='processing';c.procDone=0;c.frames=[];
  const url=URL.createObjectURL(file);const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=url;
  const refresh=()=>{if(ui.pid===pid&&ui.view==='map'){updateCardEl(c);if(ui.sel===c.id)renderDetail()}};
  try{
    await new Promise((res,rej)=>{v.onloadeddata=res;v.onerror=()=>rej(new Error('이 형식의 영상은 열 수 없어요'));setTimeout(()=>rej(new Error('영상 정보를 읽지 못했어요')),12000)});
    if(!isFinite(v.duration)||!v.videoWidth)throw new Error('영상 길이를 확인할 수 없어요');
    const vert=v.videoHeight>v.videoWidth;
    const s=Math.min(1,480/Math.max(v.videoWidth,v.videoHeight));
    const cv=document.createElement('canvas');cv.width=Math.round(v.videoWidth*s);cv.height=Math.round(v.videoHeight*s);const x=cv.getContext('2d');
    for(const pct of [.1,.3,.5,.7,.9]){await seek(v,v.duration*pct);x.drawImage(v,0,0,cv.width,cv.height);c.frames.push({t:v.duration*pct,img:cv.toDataURL('image/jpeg',.7)});c.procDone++;refresh()}
    c.procState='done';c.duration=v.duration;c.orient=vert?'v':'h';
    toast('대표 장면 5장을 만들고 업로드 원본은 삭제했어요');
  }catch(err){c.procState='failed';c.procError=err.message;c.frames=[];notify('alert',`‘${c.title}’ 영상 처리에 실패했어요. 원본은 보관되지 않으니 파일을 다시 올려 주세요.`,pid,c.id)}
  finally{v.removeAttribute('src');v.load();URL.revokeObjectURL(url);refresh();markDirty(proj(pid))}
}
let retryFor=null;
async function addFiles(files,at){
  if(ro(cur()))return;
  let i=0;
  for(const f of files){
    const pt=at?{x:at.x+i*30,y:at.y+i*30}:undefined;i++;
    if(retryFor){const c=cur().cards.find(x=>x.id===retryFor);retryFor=null;if(c&&f.type.startsWith('video/')){extractFrames(f,c);continue}}
    if(f.type.startsWith('image/')){try{const img=await downscale(f,900);addCard('ref',{media:'image',title:baseName(f.name),img,fileName:f.name,at:pt},{noFocus:true})}catch(e){toast(e.message)}}
    else if(f.type.startsWith('video/')){const c=addCard('ref',{media:'video',title:baseName(f.name),fileName:f.name,at:pt},{noFocus:true});extractFrames(f,c)}
    else{const ext=(f.name.split('.').pop()||'').toLowerCase();addCard('ref',{media:ext==='pdf'?'pdf':ext==='psd'?'psd':'doc',title:baseName(f.name),fileName:f.name,size:f.size,at:pt},{noFocus:true})}
  }
  logAct(`‘${cur().title}’에 자료 ${files.length}개를 추가했어요`,ui.pid);
}
function classify(u){let h;try{h=new URL(u).hostname.replace(/^www\./,'')}catch(e){return null}
  if(/(^|\.)youtube\.com$|youtu\.be$/.test(h))return {media:'youtube',host:'YouTube'};
  if(/figma\.com$/.test(h))return {media:'tool',host:'Figma'};
  if(/drive\.google\.com$|docs\.google\.com$/.test(h))return {media:'tool',host:'Google Drive'};
  if(/onedrive|sharepoint/.test(h))return {media:'tool',host:'OneDrive'};
  if(/dropbox\.com$/.test(h))return {media:'tool',host:'Dropbox'};
  if(/\.pdf($|\?)/i.test(u))return {media:'pdf',host:h,fileName:u.split('/').pop()};
  return {media:'link',host:h}}
function addLink(url,title,memo,at){const k=classify(url);if(!k){toast('주소 형식을 확인해 주세요');return}
  addCard('ref',Object.assign({url,title:title||(k.media==='youtube'?'YouTube 영상':k.media==='tool'?`${k.host} 자료`:k.host),body:memo||'',at},k),{noFocus:!!at})}

function mountMap(){
  const p=cur(),st=$('#stage'),r=ro(p);
  renderCards();applyView();paintSave();
  requestAnimationFrame(()=>{fit();if(ui.sel)renderDetail()});
  if(ui.linkFrom!==null)setLinkFrom(ui.linkFrom);
  const ptrs=new Map();let drag=null;
  st.addEventListener('pointerdown',e=>{
    if(e.target.closest('.toolbar,.zoomctl,.linkbanner,button,a,input,textarea'))return;
    if(e.button!==0&&e.pointerType==='mouse')return;
    st.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const v=V();
    if(ptrs.size===2){const[a,b]=[...ptrs.values()];drag={type:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y),z0:v.z,x0:v.x,y0:v.y,m0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}};return}
    const el=e.target.closest('.card');
    if(el&&r)drag={type:'tap',id:el.dataset.id,sx:e.clientX,sy:e.clientY,ox:v.x,oy:v.y,moved:false};
    else if(el){const c=p.cards.find(x=>x.id===el.dataset.id);drag={type:'card',id:c.id,el,sx:e.clientX,sy:e.clientY,ox:c.x,oy:c.y,moved:false,snap:snap(p)}}
    else drag={type:'pan',sx:e.clientX,sy:e.clientY,ox:v.x,oy:v.y,moved:false};
  });
  st.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId)||!drag)return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});const v=V();
    if(drag.type==='pinch'){if(ptrs.size<2)return;const[a,b]=[...ptrs.values()];const rc=st.getBoundingClientRect();const m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};const nz=clamp(drag.z0*Math.hypot(a.x-b.x,a.y-b.y)/drag.d0,.3,2.2);const k=nz/drag.z0;const mx=drag.m0.x-rc.left,my=drag.m0.y-rc.top;v.x=mx-(mx-drag.x0)*k+(m.x-drag.m0.x);v.y=my-(my-drag.y0)*k+(m.y-drag.m0.y);v.z=nz;applyView();return}
    const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    if(!drag.moved&&Math.hypot(dx,dy)<5)return;
    if(!drag.moved){drag.moved=true;if(drag.type==='card')drag.el.classList.add('dragging');else st.classList.add('panning')}
    if(drag.type==='card'){const c=p.cards.find(x=>x.id===drag.id);c.x=Math.round(drag.ox+dx/v.z);c.y=Math.round(drag.oy+dy/v.z);drag.el.style.left=c.x+'px';drag.el.style.top=c.y+'px';drawWires()}
    else{v.x=drag.ox+dx;v.y=drag.oy+dy;applyView()}
  });
  const end=(e,cancel)=>{
    if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
    if(!drag)return;const d=drag;
    if(d.type==='pinch'){drag=null;return}
    drag=null;st.classList.remove('panning');
    if(d.type==='tap'){if(!d.moved&&!cancel)setSel(d.id);return}
    if(d.type==='card'){d.el.classList.remove('dragging');
      if(d.moved){checkpoint(d.snap);changed()}
      else if(!cancel){if(ui.linkFrom===''){setLinkFrom(d.id)}else if(ui.linkFrom){if(ui.linkFrom!==d.id)toggleLink(ui.linkFrom,d.id);setLinkFrom(null);setSel(d.id)}else setSel(d.id)}
    }else if(!d.moved&&!cancel){if(ui.linkFrom!==null)setLinkFrom(null);else setSel(null)}
  };
  st.addEventListener('pointerup',e=>end(e,false));st.addEventListener('pointercancel',e=>end(e,true));
  st.addEventListener('wheel',e=>{e.preventDefault();const rc=st.getBoundingClientRect();if(e.ctrlKey||e.metaKey||Math.abs(e.deltaY)>Math.abs(e.deltaX)&&!e.shiftKey&&e.deltaMode===0&&Math.abs(e.deltaY)>=40){zoomAt(e.clientX-rc.left,e.clientY-rc.top,Math.exp(-e.deltaY*.0018))}else{const v=V();v.x-=e.deltaX;v.y-=e.deltaY;applyView()}},{passive:false});
  if(r)return;
  st.addEventListener('dblclick',e=>{if(e.target.closest('.card,.toolbar,.zoomctl,.linkbanner'))return;addCard('idea',{at:toWorld(e.clientX,e.clientY)},{exact:true})});
  st.addEventListener('dragover',e=>{if([...e.dataTransfer.types].includes('Files')){e.preventDefault();st.classList.add('dropping')}});
  st.addEventListener('dragleave',()=>st.classList.remove('dropping'));
  st.addEventListener('drop',e=>{e.preventDefault();st.classList.remove('dropping');const fs=[...e.dataTransfer.files];if(fs.length)addFiles(fs,toWorld(e.clientX,e.clientY))});
  $('#filein').addEventListener('change',e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)addFiles(fs)});
  const ti=$('#map-title');ti.addEventListener('input',()=>{if(ti.readOnly)return;p.title=ti.value;changed()});
}

function genFrame(h,i,label){
  const c=document.createElement('canvas');c.width=192;c.height=108;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,108);g.addColorStop(0,`hsl(${h},35%,${12+i*3}%)`);g.addColorStop(1,`hsl(${h+30},45%,${24+i*4}%)`);
  x.fillStyle=g;x.fillRect(0,0,192,108);
  for(let k=0;k<5;k++){const cx=20+((k*41+i*23)%170),cy=20+((k*17+i*11)%50);const rg=x.createRadialGradient(cx,cy,0,cx,cy,18+k*2);rg.addColorStop(0,`hsla(${40+k*12},90%,70%,.85)`);rg.addColorStop(1,'hsla(40,90%,60%,0)');x.fillStyle=rg;x.fillRect(0,0,192,108)}
  x.fillStyle='rgba(0,0,0,.35)';x.fillRect(0,78,192,30);x.fillStyle=`hsl(${h},20%,8%)`;x.fillRect(60+i*6,50,14,40);x.fillRect(120-i*5,58,10,32);
  x.fillStyle='rgba(255,255,255,.85)';x.font='10px monospace';x.fillText(label,6,100);
  try{return c.toDataURL('image/jpeg',.75)}catch(e){return ''}
}

function wizStep(){
  const p=cur(),w=wiz,s=w.step;
  const head=`<div class="eyebrow">프로젝트 완성 · ${s}/5</div><div class="steps">${[1,2,3,4,5].map(i=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div>`;
  let body='';
  if(s===1)body=`<h2>결과물과 프로젝트 정보</h2><label class="field"><span>최종 결과물 링크<em>YouTube 주소면 성과 연결 대상이 돼요</em></span><input id="w-url" type="url" value="${esc(w.url)}" placeholder="https://youtube.com/watch?v=…"></label><label class="field"><span>목표</span><textarea id="w-goal" rows="2">${esc(w.goal)}</textarea></label><div class="row2"><label class="field"><span>기간</span><input id="w-period" value="${esc(w.period)}"></label><label class="field"><span>사용 도구</span><input id="w-tools" value="${esc(w.tools)}" placeholder="Premiere Pro, CapCut"></label></div>`;
  if(s===2)body=`<h2>참여자와 표시할 역할</h2><p class="small muted">정식 기여 인증이나 자동 기여율 계산은 하지 않아요. 여기서 적은 역할이 그대로 표시돼요.</p><div class="memlist">${p.members.map(m=>`<div class="memrow"><b>${esc(dispName(m))}</b><input data-mi="${m.userId}" value="${esc(w.roles[m.userId]||'')}" placeholder="역할 (예: 촬영)" aria-label="역할"><span class="chip">${PERM[m.perm]}</span></div>`).join('')}</div>`;
  if(s===3)body=`<h2>공개할 결과와 작업 과정</h2><p class="small muted">고른 카드만 공개 페이지에 복사돼요. 고르지 않은 자료는 공개 페이지에 저장되지 않아요.</p><div class="pick">${p.cards.map(c=>`<label><input type="checkbox" data-pk="${c.id}" ${w.pick.has(c.id)?'checked':''}><span class="chip kchip k-${c.kind}">${kindLabel(c)}</span><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.title||'제목 없음')}</span>${c.public?'':'<span class="chip st-warn" style="margin-left:auto">비공개 자료</span>'}</label>`).join('')||'<p class="muted">카드가 없어요.</p>'}</div>`;
  if(s===4)body=`<h2>자동으로 구성된 페이지 미리보기</h2><p class="small muted">수정할 부분이 있으면 이전 단계로 돌아가세요.</p><div style="max-height:420px;overflow:auto;border-radius:14px">${pubHTML(wizPage())}</div>`;
  if(s===5)body=`<h2>공개 여부</h2><div class="starts"><label class="start"><input type="radio" name="w-vis" value="public" ${w.vis==='public'?'checked':''}><span><b>공개</b><small>공개 주소로 누구나 볼 수 있어요</small></span></label><label class="start"><input type="radio" name="w-vis" value="private" ${w.vis!=='public'?'checked':''}><span><b>비공개</b><small>나와 초대한 참여자만 볼 수 있어요</small></span></label></div><label class="check"><input type="checkbox" id="w-home" ${w.home?'checked':''}><span>Creator Home에 연결<br><span class="small muted">공개로 선택한 경우에만 다른 사람에게 보여요.</span></span></label>${ownDone()>=3&&p.status!=='done'?'<p class="small" style="color:var(--warn);margin:0">무료 플랜 기준안(완성 3개)을 넘어요. 최종 한도는 아직 확정되지 않았어요.</p>':''}`;
  modal(`${head}${body}<div class="mfoot"><button class="btn ghost" data-act="${s===1?'close':'w-prev'}">${s===1?'취소':'이전'}</button><button class="btn primary" data-act="${s===5?'w-finish':'w-next'}" id="w-main">${s===5?'완성하고 페이지 만들기':'다음'}</button></div>`,null,s===4);
}
function wizCollect(){
  const w=wiz,s=w.step;
  if(s===1){w.url=$('#w-url').value.trim();w.goal=$('#w-goal').value.trim();w.period=$('#w-period').value.trim();w.tools=$('#w-tools').value.trim()}
  if(s===2)document.querySelectorAll('[data-mi]').forEach(el=>w.roles[el.dataset.mi]=el.value.trim());
  if(s===3){w.pick=new Set([...document.querySelectorAll('[data-pk]')].filter(el=>el.checked).map(el=>el.dataset.pk))}
  if(s===5){w.vis=document.querySelector('[name=w-vis]:checked').value;w.home=$('#w-home').checked}
}
async function wizFinish(){
  const p=cur(),w=wiz,first=p.status!=='done';
  busy($('#w-main'),true,'저장 중…');
  p.result={url:w.url,goal:w.goal,period:w.period,tools:w.tools};p.roles=w.roles;p.publicCards=[...w.pick];p.visibility=w.vis;p.inHome=w.home;p.status='done';p.completed=now();
  p.metrics=w.url&&classify(w.url)?.media==='youtube'?{status:'pending'}:null;
  markDirty(p);await flush();
  if(saveState==='failed'){busy($('#w-main'),false);return}
  await syncPublicPage(p);
  if(first){logAct(`‘${p.title}’을(를) 완성했어요`,p.id);notify('general',`‘${p.title}’ 프로젝트를 완성했어요. ${w.vis==='public'?'공개 페이지가 만들어졌어요.':'비공개로 보관돼요.'}`,p.id)}
  closeModal();wiz=null;ui.sel=null;go('public',p.id);toast(w.vis==='public'?'공개 페이지를 만들었어요':'완성했어요 · 비공개');
}

/* ---------- 공개 페이지 ---------- */
function procCard(c){
  let m='';
  if(c.img)m=`<img src="${c.img}" alt="">`;
  else if(c.frames&&c.frames.length)m=`<div class="frames ${c.orient==='v'?'v':''}">${c.frames.map(f=>`<img src="${f.img}" alt="">`).join('')}</div>`;
  else if(c.media==='youtube')m=mediaHTML(c,false);
  return `<div class="proccard"><span class="chip kchip k-${c.kind}" style="justify-self:start">${kindLabel(c)}</span>${m}<h3>${esc(c.title||'')}</h3>${c.body?`<p>${esc(c.body)}</p>`:''}</div>`;
}
function pubHTML(pg){
  const r=pg.result||{};const k=r.url?classify(r.url):null;
  const owner=(pg.members||[]).find(m=>m.owner)||{};
  const by=[esc(owner.name||''),owner.handle?'@'+esc(owner.handle):''].filter(Boolean).join(' · ');
  return `<article class="pub">
  <div class="pub-hero"><div class="eyebrow">${esc(pg.type)}${r.period?' · '+esc(r.period):''}</div><h1>${esc(pg.title)}</h1>${r.goal?`<p class="lede">${esc(r.goal)}</p>`:''}${by?`<div class="pub-by">${owner.handle?`<a href="${homeUrl(owner.handle)}" style="color:inherit">${by}</a>`:by}</div>`:''}</div>
  ${r.url?`<div class="pub-sec"><a class="pub-result" href="${esc(r.url)}" target="_blank" rel="noopener"><div class="yt"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg><span>${esc(k?.host||'')}</span></div><div><b>결과물 보기 ↗</b><small>${esc(r.url)}</small></div></a></div>`:''}
  <div class="pub-sec"><h2>역할과 참여</h2><ul class="roles">${(pg.members||[]).map(m=>`<li>${m.name?`<b>${esc(m.name)}</b>`:(m.handle?`<b>@${esc(m.handle)}</b>`:'')}<span>${esc(m.role||(m.owner?'소유자':'참여'))}</span></li>`).join('')}</ul>${r.tools?`<div class="chips">${r.tools.split(',').map(t=>t.trim()).filter(Boolean).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>`:''}</div>
  <div class="pub-sec"><h2>작업 과정</h2>${(pg.cards||[]).length?`<div class="procgrid">${pg.cards.map(procCard).join('')}</div>`:'<p class="muted" style="margin:0">공개할 작업 과정을 고르지 않았어요.</p>'}</div>
  </article>`;
}
function urlBox(url,label){return `<div class="urlbox"><code>${esc(url)}</code><button class="btn sm" data-act="copy" data-text="${esc(url)}">${label}</button></div>`}
function vPublic(p){
  const own=p.role==='owner',live=shouldPublish(p);
  return `<div class="page">
  <div class="pubbar"><button class="btn ghost sm" data-act="go" data-view="projects">← 프로젝트</button><span class="chip ${live?'st-ok':''}">${live?'공개 중':'비공개 · 나와 참여자만'}</span>${live&&p.inHome?'<span class="chip">Creator Home 연결됨</span>':''}<span style="flex:1"></span>${own?`<button class="btn sm" data-act="edit-public">공개 정보 수정</button>${p.status==='done'?`<button class="btn sm" data-act="reopen" data-id="${p.id}">다시 작업 열기</button>`:''}`:''}<button class="btn sm" data-act="peek-map" data-id="${p.id}">작업 공간 보기</button></div>
  ${live?urlBox(projUrl(p.id),'주소 복사'):''}
  ${pubHTML(pageFromProject(p))}
  ${own&&p.metrics?`<section class="panel"><div class="panelhead"><h2>성과</h2></div>${perfBlock(p)}</section>`:''}
  </div>`;
}

/* 로그인 없이 보는 공개 화면 */
function guestBar(){return `<div class="guestbar"><a class="brand" href="${BASE}" style="text-decoration:none;color:var(--ink)">${LOGO}Ballacove</a><button class="btn sm ${me?'':'primary'}" data-act="to-app">${me?'내 작업 공간으로':'로그인 · 가입'}</button></div>`}

function vGuestCreator(){
  const c=ui.pub;
  if(!c?.profile)return `${guestBar()}<div class="page"><div class="panel empty"><h2>찾을 수 없는 Creator Home이에요</h2><p class="muted" style="margin:0">주소 아이디가 바뀌었을 수 있어요.</p></div></div>`;
  const pr=c.profile;
  const grid=list=>`<div class="cgrid">${list.map(pg=>`<button class="ccard" data-act="pub-open" data-id="${pg.id}"><div class="cover">${coverOf(pg)}</div><div class="cb"><h3>${esc(pg.title)}</h3><div class="small muted">${esc(pg.type)}${pg.result?.period?' · '+esc(pg.result.period):''}</div><div class="small">${esc((pg.members||[]).find(m=>m.userId===pr.id)?.role||'')}</div></div></button>`).join('')}</div>`;

  <section class="panel"><h2>완성한 프로젝트</h2>${c.own.length?grid(c.own):'<p class="muted" style="margin:0">아직 공개한 프로젝트가 없어요.</p>'}</section>
  ${c.joined.length?`<section class="panel"><h2>참여한 프로젝트</h2>${grid(c.joined)}</section>`:''}
  </div>`;
}
const pageFromRow=r=>({id:r.project_id,title:r.title,type:r.type,result:r.result,cards:r.cards||[],members:r.members||[],inHome:r.in_home});
async function showPublicProject(id){
  publicMode=true;ui.view='loading';render();
  const {data}=await sb.from('public_pages').select('*').eq('project_id',id).maybeSingle();
  ui.pub={pg:data?pageFromRow(data):null};ui.view='pubpage';render();
  if(data)document.title=`${data.title} · Ballacove`;
}
async function showPublicCreator(h){
  publicMode=true;ui.view='loading';render();
  const {data:pr}=await sb.from('profiles').select('id,name,handle,intro,fields').eq('handle',h.toLowerCase()).maybeSingle();
  let own=[],joined=[];
  if(pr){
    const [{data:a},{data:b}]=await Promise.all([
      sb.from('public_pages').select('*').eq('owner_id',pr.id).eq('in_home',true).order('published_at',{ascending:false}),
      sb.from('public_pages').select('*').contains('members',[{userId:pr.id}]).neq('owner_id',pr.id).order('published_at',{ascending:false})]);
    own=(a||[]).map(pageFromRow);joined=(b||[]).map(pageFromRow);
  }
  ui.pub={profile:pr,own,joined};ui.view='pubcreator';render();
}

  const pr=db.profile;
  const mine=db.projects.filter(p=>p.status==='done'&&p.role==='owner');

  const joined=db.projects.filter(p=>p.status==='done'&&p.role!=='owner'&&p.visibility==='public');
  const grid=list=>`<div class="cgrid">${list.map(p=>`<button class="ccard" data-act="open-project" data-id="${p.id}"><div class="cover">${coverOf(pageFromProject(p))}</div><div class="cb"><h3>${esc(p.title)}</h3><div class="small muted">${esc(p.type)} · ${esc(p.result?.period||fmtDate(p.completed||p.updated))}</div><div class="small">${esc((p.roles||{})[me.id]||'')}</div></div></button>`).join('')}</div>`;
  return `<div class="page">
  <section class="panel profile"><div class="avatar" aria-hidden="true">${esc((pr.name||'').slice(0,1))}</div><div style="display:grid;gap:4px;min-width:0"><div class="eyebrow">CREATOR HOME</div>${pr.name?`<h1>${esc(pr.name)}</h1>`:'<h1 class="muted" style="font-weight:500">이름이 비어 있어요</h1>'}${pr.handle?`<div class="small muted">@${esc(pr.handle)}</div>`:''}${pr.intro?`<p style="margin:4px 0 0">${esc(pr.intro)}</p>`:''}<div class="chips">${pr.fields.map(f=>`<span class="chip">${esc(f)}</span>`).join('')}</div></div><div class="pacts" style="display:grid;gap:8px;justify-items:start"><button class="btn sm" data-act="edit-profile">프로필 수정</button></div></section>

function openProfile(){
  const pr=db.profile;
  modal(`<h2>프로필 수정</h2><form id="pfform" class="stack" novalidate><label class="field"><span>이름</span><input id="pf-name" maxlength="40" value="${esc(pr.name)}"></label><label class="field"><span>주소 아이디<em>영문 소문자·숫자·.·_ 3~30자</em></span><input id="pf-handle" maxlength="30" autocomplete="off" value="${esc(pr.handle)}"></label><label class="field"><span>소개</span><textarea id="pf-intro" rows="2" maxlength="200">${esc(pr.intro)}</textarea></label><label class="field"><span>관심 분야<em>쉼표로 구분</em></span><input id="pf-fields" value="${esc(pr.fields.join(', '))}"></label><p class="formerr" id="pf-err" hidden></p><div class="mfoot"><button type="button" class="btn ghost" data-act="close">취소</button><button class="btn primary" id="pf-btn">저장</button></div></form>`,m=>{
    m.querySelector('#pfform').addEventListener('submit',async e=>{e.preventDefault();const er=$('#pf-err');er.hidden=true;
      const name=$('#pf-name').value.trim(),handle=$('#pf-handle').value.trim().replace(/^@/,'').toLowerCase(),intro=$('#pf-intro').value.trim(),fields=$('#pf-fields').value.split(',').map(s=>s.trim()).filter(Boolean);
      if(handle&&!/^[a-z0-9._]{3,30}$/.test(handle)){er.textContent='주소 아이디는 영문 소문자·숫자·마침표·밑줄로 3~30자예요.';er.hidden=false;return}
      busy($('#pf-btn'),true);
      const {error}=await sb.from('profiles').update({name,handle:handle||null,intro,fields}).eq('id',me.id);
      busy($('#pf-btn'),false);
      if(error){er.textContent=error.code==='23505'?'이미 다른 사람이 쓰는 아이디예요.':'저장하지 못했어요. 다시 시도해 주세요.';er.hidden=false;return}
      Object.assign(pr,{name,handle,intro,fields});closeModal();render();toast('프로필을 저장했어요');
      db.projects.filter(p=>p.role==='owner'&&shouldPublish(p)).forEach(p=>syncPublicPage(p));
    })});
}

  const ns=db.notifications.slice().sort((a,b)=>b.at-a.at);
  const need=ns.filter(n=>n.kind!=='general'),gen=ns.filter(n=>n.kind==='general');
  const item=n=>`<button class="notif ${n.read?'':'unread'} ${n.kind==='alert'?'alert':''}" data-act="notif" data-id="${n.id}"><span class="pip"></span><span class="grow"><span class="txt">${esc(n.text)}</span><time>${rel(n.at)}</time></span></button>`;
  return `<div class="page"><header class="pagehead"><div><div class="eyebrow">내 행동으로 생긴 일은 알리지 않아요</div><h1>알림함</h1></div><button class="btn ghost" data-act="readall">모두 읽음</button></header>
  <section class="panel"><h2>확인이 필요한 알림</h2><div>${need.map(item).join('')||'<p class="muted" style="margin:0">지금 확인할 알림이 없어요.</p>'}</div></section>

}

/* 신고 */
function openReport(pid){
  if(!me){modal(`<h2>신고하려면 로그인이 필요해요</h2><p class="muted">로그인하면 접수 상태와 처리 결과를 알림으로 받을 수 있어요.</p><div class="mfoot"><button class="btn ghost" data-act="close">닫기</button><button class="btn primary" data-act="to-app">로그인 · 가입</button></div>`);return}
  modal(`<h2>신고하기</h2><form id="rpform" class="stack"><label class="field"><span>사유</span><select id="rp-why"><option>도용·무단 사용</option><option>소유권 분쟁</option><option>괴롭힘·혐오 표현</option><option>스팸·광고</option><option>기타</option></select></label><label class="field"><span>설명</span><textarea id="rp-desc" rows="3" required placeholder="어떤 부분이 문제인지 적어 주세요"></textarea></label><label class="field"><span>근거 링크<em>스크린샷을 올린 주소나 원본 주소</em></span><input id="rp-link" type="url" placeholder="https://"></label><p class="small muted">접수하면 사건번호가 생기고, 접수됨 → 검토 중 → 처리 완료 순서로 알려 드려요. 결과에 대해 한 번 재검토를 요청할 수 있어요.</p><div class="mfoot"><button type="button" class="btn ghost" data-act="close">취소</button><button class="btn primary" id="rp-btn">신고 접수</button></div></form>`,m=>{
    m.querySelector('#rpform').addEventListener('submit',async e=>{e.preventDefault();const d=new Date();const no=`BC-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${String(Math.floor(Math.random()*90000)+10000)}`;
      busy($('#rp-btn'),true);
      const link=$('#rp-link').value.trim();
      const {error}=await sb.from('reports').insert({case_no:no,project_id:pid||null,reason:$('#rp-why').value,description:$('#rp-desc').value.trim(),evidence_link:link||null,evidence_count:link?1:0});
      if(error){busy($('#rp-btn'),false);toast('신고를 접수하지 못했어요. 다시 시도해 주세요.');return}
      if(started)notify('general',`신고 ${no}가 접수됐어요. 검토가 시작되면 알려 드릴게요.`,null);
      modal(`<h2>신고가 접수됐어요</h2><p>사건번호 <b class="mono">${no}</b></p><div class="casesteps"><span class="on">접수됨</span><span>검토 중</span><span>처리 완료</span></div><p class="small muted">처리 결과에는 판단 이유를 함께 안내하고, 상대방 개인정보와 상세 제재 내용은 보호해요.</p><div class="mfoot"><button class="btn primary" data-act="close">확인</button></div>`)})});
}

/* ---------- 라우팅 ---------- */
function go(view,pid){ui.view=view;if(pid!==undefined)ui.pid=pid;if(view!=='map'){ui.linkFrom=null}render();$('#main').scrollTop=0}
function render(){
  $('#app').classList.toggle('guest',!started||publicMode);
  paintChrome();const m=$('#main');
  if(ui.view==='auth'){m.innerHTML=vAuth();mountAuth();return}
  if(ui.view==='loading'){m.innerHTML='<div class="loading"><span class="spin"></span><span>불러오는 중</span></div>';return}
  if(ui.view==='error'){m.innerHTML=`<div class="authwrap"><div class="authcard"><h2>불러오지 못했어요</h2><p class="muted small" style="margin:0">${esc(ui.err||'인터넷 연결을 확인해 주세요.')}</p><div class="mfoot"><button class="btn ghost" data-act="logout">로그아웃</button><button class="btn primary" data-act="reload">다시 시도</button></div></div></div>`;return}
  if(ui.view==='pubpage'){m.innerHTML=vGuestPage();return}
  if(ui.view==='pubcreator'){m.innerHTML=vGuestCreator();return}
  const p=cur();
  if(ui.view==='map'&&p){m.innerHTML=vMap(p);mountMap();return}
  if(ui.view==='public'&&p){m.innerHTML=vPublic(p);return}
  m.innerHTML=ui.view==='projects'?vProjects():ui.view==='creator'?vCreator():ui.view==='inbox'?vInbox():ui.view==='trash'?vTrash():vHome();
}
function openProject(id,cid){const p=proj(id);if(!p)return toast('이 프로젝트는 더 이상 열 수 없어요');ui.sel=cid||null;go(p.status==='done'?'public':'map',id)}
async function start(){
  if(started)return;
  publicMode=false;ui.pub=null;ui.view='loading';render();
  try{await loadAll();started=true;ui.view='home';render()}
  catch(e){console.error(e);ui.view='error';ui.err='데이터를 불러오지 못했어요. 인터넷 연결을 확인한 뒤 다시 시도해 주세요.';render()}
}
function toApp(){history.replaceState(null,'',BASE);document.title='Ballacove';publicMode=false;ui.pub=null;closeModal();if(me)start();else{ui.view='auth';render()}}

/* ---------- 동작 ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='close-back'){if(e.target===t)closeModal();return}
  const id=t.dataset.id;const p=cur();
  switch(a){
    case 'go':closeModal();go(t.dataset.view);break;
    case 'close':closeModal();break;
    case 'ok':{const f=pendingOk;closeModal();f&&f();break}
    case 'auth-mode':ui.authMode=t.dataset.m;render();break;
    case 'logout':flush().finally(()=>sb.auth.signOut());break;
    case 'reload':started=false;start();break;
    case 'to-app':toApp();break;
    case 'pub-open':history.pushState(null,'',projUrl(id));showPublicProject(id);break;
    case 'new-project':openNewProject();break;
    case 'demo-open':demo=demo||makeDemo();ui.sel=null;go('map','demo');break;
    case 'demo-copy':copyDemo();break;
    case 'hint-close':hintClosed.add(ui.pid);$('#hint').hidden=true;break;
    case 'open-project':openProject(id);break;
    case 'tab':ui.tab=t.dataset.tab;render();break;
    case 'archive':{const q=proj(id);q.status='archived';markDirty(q);syncPublicPage(q);render();toast('보관했어요');break}
    case 'unarchive':{const q=proj(id);if(ownActive()>=3)return toast('진행 중 3개를 넘어요. 하나를 정리한 뒤 다시 시도하세요.');q.status=q.completed?'done':'active';markDirty(q);syncPublicPage(q);render();break}
    case 'del-project':{const q=proj(id);confirmBox('프로젝트를 삭제할까요?',`‘${esc(q.title)}’은(는) 휴지통으로 옮겨지고 30일 동안 복구할 수 있어요.`,'휴지통으로 이동',true,()=>{db.projects=db.projects.filter(x=>x.id!==id);q.deletedAt=now();db.trash.unshift(q);markDirty(q);syncPublicPage(q);render();toast('휴지통으로 옮겼어요')});break}
    case 'restore':{const q=db.trash.find(x=>x.id===id);db.trash=db.trash.filter(x=>x.id!==id);q.deletedAt=null;if(q.status==='active'&&ownActive()>=3)q.status='archived';db.projects.unshift(q);markDirty(q);syncPublicPage(q);render();toast(q.status==='archived'?'복구했어요 · 진행 중이 가득 차서 보관함에 넣었어요':'복구했어요');break}
    case 'purge':{const q=db.trash.find(x=>x.id===id);confirmBox('영구 삭제할까요?',`‘${esc(q.title)}’을(를) 영구 삭제하면 되돌릴 수 없어요.`,'영구 삭제',true,async()=>{const {error}=await sb.from('projects').delete().eq('id',id);if(error)return toast('삭제하지 못했어요');db.trash=db.trash.filter(x=>x.id!==id);render()});break}
    case 'reopen':{const q=proj(id);if(ownActive()>=3)return toast('진행 중 3개를 넘어요. 하나를 정리한 뒤 다시 시도하세요.');q.status='active';markDirty(q);notify('general',`‘${q.title}’ 작업을 다시 열었어요`,q.id);logAct(`‘${q.title}’ 작업을 다시 열었어요`,q.id);ui.sel=null;go('map',q.id);break}
    case 'peek-map':ui.sel=null;go('map',id);break;
    case 'edit-public':openComplete();break;
    case 'copy':{const txt=t.dataset.text;const done=()=>toast('주소를 복사했어요');try{navigator.clipboard.writeText(txt).then(done,()=>selectCode(t))}catch(err){selectCode(t)}break}
    case 'edit-profile':openProfile();break;
    case 'report':openReport(id);break;
    case 'notif':{const n=db.notifications.find(x=>x.id===id);if(!n.read){n.read=true;sb.from('notifications').update({read:true}).eq('id',id).then(()=>{});paintChrome()}if(n.pid&&proj(n.pid))openProject(n.pid,n.cid);else render();break}
    case 'readall':db.notifications.forEach(n=>n.read=true);sb.from('notifications').update({read:true}).eq('user_id',me.id).eq('read',false).then(()=>{});render();break;
    case 'save-retry':p&&dirty.add(p.id);flush();break;
    case 'members':openMembers();break;
    case 'mem-remove':{const m=p.members.find(x=>x.userId===id);confirmBox('참여자를 내보낼까요?',`${esc(dispName(m))}님은 이 프로젝트를 더 이상 볼 수 없게 돼요. 완성 페이지에 표시된 역할 기록은 그대로 남아요.`,'내보내기',true,async()=>{const {error}=await sb.from('project_members').delete().eq('project_id',p.id).eq('user_id',id);if(error)return toast('내보내지 못했어요');p.members=p.members.filter(x=>x.userId!==id);toast('내보냈어요');openMembers();const b=document.querySelector('[data-act="members"]');if(b)b.textContent=`참여자 ${p.members.length}`});break}
    case 'leave':confirmBox('프로젝트에서 나갈까요?','나가면 이 프로젝트를 더 이상 볼 수 없어요. 다시 참여하려면 소유자가 초대해야 해요.','나가기',true,async()=>{const {error}=await sb.from('project_members').delete().eq('project_id',p.id).eq('user_id',me.id);if(error)return toast('나가지 못했어요');db.projects=db.projects.filter(x=>x.id!==p.id);go('projects');toast('프로젝트에서 나갔어요')});break;
    // 맵
    case 'undo':undo();break;case 'redo':redo();break;
    case 'versions':openVersions();break;
    case 'v-restore':{const v=p.versions.find(x=>x.id===id);confirmBox(`‘${esc(v.name)}’로 복구할까요?`,'지금 상태는 ‘복구 전 자동 보관’ 저장 지점으로 남겨 두고 복구해요.','복구',false,()=>{p.versions.push({id:uid(),name:'복구 전 자동 보관',at:now(),snap:snap(p)});checkpoint();restoreSnap(v.snap);logAct(`‘${v.name}’ 버전으로 복구했어요`,p.id);toast('복구했어요');setTimeout(fit,30)});break}
    case 'complete':if(!p.cards.length)return toast('카드가 하나 이상 있어야 완성할 수 있어요');openComplete();break;
    case 'w-next':wizCollect();if(wiz.step===1&&wiz.url&&!classify(wiz.url))return toast('결과물 주소 형식을 확인해 주세요');wiz.step++;wizStep();break;
    case 'w-prev':wizCollect();wiz.step--;wizStep();break;
    case 'w-finish':wizCollect();wizFinish();break;
    case 'add':addCard(t.dataset.kind);break;
    case 'add-file':retryFor=null;$('#filein').click();break;
    case 'retry':retryFor=id;$('#filein').click();break;
    case 'add-link':openLinkModal();break;
    case 'link-mode':if(ui.linkFrom!==null)setLinkFrom(null);else setLinkFrom(ui.sel||'');break;
    case 'link-cancel':setLinkFrom(null);break;
    case 'zoom':{const st=$('#stage');zoomAt(st.clientWidth/2,st.clientHeight/2,+t.dataset.f);break}
    case 'fit':fit();break;
    case 'shelf':openShelf();break;
    case 'select':setSel(id);break;
    case 'd-close':setSel(null);break;
    case 'd-link':setLinkFrom(ui.sel);break;
    case 'd-shelve':{checkpoint();const c=p.cards.find(x=>x.id===ui.sel);p.cards=p.cards.filter(x=>x.id!==c.id);p.shelf.push(c);ui.sel=null;renderCards();renderDetail();changed();toast('캔버스에서 지웠어요 · 자료함에 남아 있어요');break}
    case 'd-delete':delMaterial(ui.sel,false);break;
    case 'unshelve':{checkpoint();const c=p.shelf.find(x=>x.id===id);p.shelf=p.shelf.filter(x=>x.id!==id);const pt=centerPt();c.x=Math.round(pt.x-110);c.y=Math.round(pt.y-40);p.cards.push(c);closeModal();renderCards();setSel(c.id);changed();break}
    case 'shelf-del':delMaterial(id,true);break;
  }
});
function selectCode(btn){const code=btn.parentElement.querySelector('code');if(!code)return;const r=document.createRange();r.selectNodeContents(code);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('주소를 선택했어요. 복사해서 쓰세요.')}
function delMaterial(id,fromShelf){
  const p=cur();if(ro(p))return;const c=(fromShelf?p.shelf:p.cards).find(x=>x.id===id);if(!c)return;
  const linked=p.links.filter(l=>l.includes(id)).map(l=>l[0]===id?l[1]:l[0]).map(x=>p.cards.find(k=>k.id===x)).filter(Boolean);
  const scenes=linked.filter(x=>x.kind==='scene').length;
  const msg=linked.length?`이 자료는 ${scenes?`장면 ${scenes}개를 포함해 `:''}카드 ${linked.length}개와 연결돼 있어요. 삭제하면 연결도 함께 사라져요.`:'프로젝트에서 이 자료를 삭제해요. 되돌리기로 복구할 수 있어요.';
  confirmBox(`‘${esc(c.title||'제목 없음')}’ 자료를 삭제할까요?`,msg,'자료 삭제',true,()=>{checkpoint();if(fromShelf)p.shelf=p.shelf.filter(x=>x.id!==id);else p.cards=p.cards.filter(x=>x.id!==id);p.links=p.links.filter(l=>!l.includes(id));ui.sel=null;renderCards();renderDetail();changed();toast('자료를 삭제했어요')});
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#modal').hidden){closeModal();return}if(ui.view==='map'){if(ui.linkFrom!==null)setLinkFrom(null);else setSel(null)}return}
  if(ui.view!=='map'||!$('#modal').hidden)return;
  const typing=e.target.closest('input,textarea,select');
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();e.shiftKey?redo():undo()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'&&!typing){e.preventDefault();redo()}
  if((e.key==='Delete'||e.key==='Backspace')&&!typing&&ui.sel){e.preventDefault();delMaterial(ui.sel,false)}
});
document.addEventListener('paste',e=>{
  if(ui.view!=='map'||!$('#modal').hidden||e.target.closest('input,textarea')||ro(cur()))return;
  const fs=[...(e.clipboardData?.files||[])];if(fs.length){e.preventDefault();addFiles(fs);return}
  const txt=(e.clipboardData?.getData('text')||'').trim();if(!txt)return;e.preventDefault();
  if(/^https?:\/\/\S+$/.test(txt))addLink(txt);else addCard('memo',{title:txt.slice(0,40),body:txt.length>40?txt:''},{noFocus:true});
});
window.addEventListener('resize',()=>{if(ui.view==='map')drawWires()});
window.addEventListener('popstate',()=>{const qs=new URLSearchParams(location.search);if(qs.get('p'))showPublicProject(qs.get('p'));else if(qs.get('u'))showPublicCreator(qs.get('u'));else toApp()});

/* ---------- 시작 ---------- */
(async function boot(){
  const qs=new URLSearchParams(location.search);
  const {data:{session}}=await sb.auth.getSession();
  me=session?.user||null;
  sb.auth.onAuthStateChange((event,s)=>{
    const u=s?.user||null;
    if(event==='PASSWORD_RECOVERY')setTimeout(openNewPassword,400);
    if(u&&(!me||me.id!==u.id)){me=u;if(!publicMode)setTimeout(start,0);else render()}
    else if(!u&&me){me=null;started=false;db=emptyDb();Object.keys(hist).forEach(k=>delete hist[k]);ui.authMode='login';if(!publicMode){ui.view='auth'}render()}
    else if(u)me=u;
  });
  if(qs.get('p'))return showPublicProject(qs.get('p'));
  if(qs.get('u'))return showPublicCreator(qs.get('u'));
  if(me)await start();else{ui.view='auth';render()}
})();

</script>
