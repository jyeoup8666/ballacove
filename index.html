/* ---------- 라우팅 ---------- */
function go(view,pid){if(editing)finishEdit();ui.view=view;if(pid!==undefined)ui.pid=pid;if(view!=='map'){ui.linkFrom=null}render();$('#main').scrollTop=0}
function render(){
  $('#app').classList.toggle('guest',!started||publicMode);
  paintChrome();const m=$('#main');
  if(ui.view==='auth'){m.innerHTML=vAuth();mountAuth();return}
  if(ui.view==='loading'){m.innerHTML='<div class="loading"><span class="spin"></span><span>불러오는 중</span></div>';return}
  if(ui.view==='error'){m.innerHTML=`<div class="authwrap"><div class="authcard"><h2>불러오지 못했어요</h2><p class="muted small" style="margin:0">${esc(ui.err||'인터넷 연결을 확인해 주세요.')}</p><div class="mfoot"><button class="btn ghost" data-act="logout">로그아웃</button><button class="btn primary" data-act="reload">다시 시도</button></div></div></div>`;return}
  if(ui.view==='pubpage'){m.innerHTML=vGuestPage();return}
  if(ui.view==='pubcreator'){m.innerHTML=vGuestCreator();return}
  const p=cur();
  if(ui.view==='map'&&p){m.innerHTML=vMap(p);mountMap();return}
  if(ui.view==='public'&&p){m.innerHTML=vPublic(p);return}
  m.innerHTML=ui.view==='admin'?vAdmin():ui.view==='projects'?vProjects():ui.view==='creator'?vCreator():ui.view==='inbox'?vInbox():ui.view==='trash'?vTrash():vHome();
}
function openProject(id,cid){const p=proj(id);if(!p)return toast('이 프로젝트는 더 이상 열 수 없어요');ui.sel=cid||null;go(p.status==='done'?'public':'map',id)}
async function start(){
  if(started)return;
  publicMode=false;ui.pub=null;ui.view='loading';render();
  try{await loadAll();started=true;ui.view='home';render()}
  catch(e){console.error(e);ui.view='error';ui.err='데이터를 불러오지 못했어요. 인터넷 연결을 확인한 뒤 다시 시도해 주세요.';render()}
}
function toApp(){history.replaceState(null,'',BASE);document.title='Ballacove';publicMode=false;ui.pub=null;closeModal();if(me)start();else{ui.view='auth';render()}}

/* ---------- 동작 ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='close-back'){if(e.target===t)closeModal();return}
  const id=t.dataset.id;const p=cur();
  switch(a){
    case 'go':closeModal();go(t.dataset.view);break;
    case 'close':closeModal();break;
    case 'ok':{const f=pendingOk;closeModal();f&&f();break}
    case 'auth-mode':ui.authMode=t.dataset.m;render();break;
    case 'logout':flush().finally(()=>sb.auth.signOut());break;
    case 'reload':started=false;start();break;
    case 'to-app':toApp();break;
    case 'yt-play':{const box=t.closest('.ytp');if(box)box.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" title="YouTube 영상" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;break}
    case 'pub-open':history.pushState(null,'',projUrl(id));showPublicProject(id);break;
    case 'new-project':openNewProject();break;
    case 'plan-pick':openPlanPicker();break;
    case 'plan-save':{const v=document.querySelector('[name=pl]:checked')?.value;closeModal();if(v&&v!==db.profile.plan)setPlan(me.id,v);break}
    case 'admin-reload':adminRows=null;render();break;
    case 'demo-open':demo=demo||makeDemo();ui.sel=null;go('map','demo');break;
    case 'demo-copy':copyDemo();break;
    case 'hint-close':hintClosed.add(ui.pid);$('#hint').hidden=true;break;
    case 'open-project':openProject(id);break;
    case 'tab':ui.tab=t.dataset.tab;render();break;
    case 'archive':{const q=proj(id);q.status='archived';markDirty(q);syncPublicPage(q);render();toast('보관했어요');break}
    case 'unarchive':{const q=proj(id);if(activeFull())return toast(`진행 중 ${plan().active}개를 넘어요. 하나를 정리한 뒤 다시 시도하세요.`);q.status=q.completed?'done':'active';markDirty(q);syncPublicPage(q);render();break}
    case 'del-project':{const q=proj(id);confirmBox('프로젝트를 삭제할까요?',`‘${esc(q.title)}’은(는) 휴지통으로 옮겨지고 30일 동안 복구할 수 있어요.`,'휴지통으로 이동',true,()=>{db.projects=db.projects.filter(x=>x.id!==id);q.deletedAt=now();db.trash.unshift(q);markDirty(q);syncPublicPage(q);render();toast('휴지통으로 옮겼어요')});break}
    case 'restore':{const q=db.trash.find(x=>x.id===id);db.trash=db.trash.filter(x=>x.id!==id);q.deletedAt=null;if(q.status==='active'&&activeFull())q.status='archived';db.projects.unshift(q);markDirty(q);syncPublicPage(q);render();toast(q.status==='archived'?'복구했어요 · 진행 중이 가득 차서 보관함에 넣었어요':'복구했어요');break}
    case 'purge':{const q=db.trash.find(x=>x.id===id);confirmBox('영구 삭제할까요?',`‘${esc(q.title)}’을(를) 영구 삭제하면 되돌릴 수 없어요.`,'영구 삭제',true,async()=>{await purgeMedia(id);const {error}=await sb.from('projects').delete().eq('id',id);if(error)return toast('삭제하지 못했어요');db.trash=db.trash.filter(x=>x.id!==id);render()});break}
    case 'reopen':{const q=proj(id);if(activeFull())return toast(`진행 중 ${plan().active}개를 넘어요. 하나를 정리한 뒤 다시 시도하세요.`);q.status='active';markDirty(q);notify('general',`‘${q.title}’ 작업을 다시 열었어요`,q.id);logAct(`‘${q.title}’ 작업을 다시 열었어요`,q.id);ui.sel=null;go('map',q.id);break}
    case 'peek-map':ui.sel=null;go('map',id);break;
    case 'edit-public':openComplete();break;
    case 'copy':{const txt=t.dataset.text;const done=()=>toast('주소를 복사했어요');try{navigator.clipboard.writeText(txt).then(done,()=>selectCode(t))}catch(err){selectCode(t)}break}
    case 'edit-profile':openProfile();break;
    case 'report':openReport(id);break;
    case 'notif':{const n=db.notifications.find(x=>x.id===id);if(!n.read){n.read=true;sb.from('notifications').update({read:true}).eq('id',id).then(()=>{});paintChrome()}if(n.pid&&proj(n.pid))openProject(n.pid,n.cid);else render();break}
    case 'readall':db.notifications.forEach(n=>n.read=true);sb.from('notifications').update({read:true}).eq('user_id',me.id).eq('read',false).then(()=>{});render();break;
    case 'save-retry':p&&dirty.add(p.id);flush();break;
    case 'members':openMembers();break;
    case 'mem-remove':{const m=p.members.find(x=>x.userId===id);confirmBox('참여자를 내보낼까요?',`${esc(dispName(m))}님은 이 프로젝트를 더 이상 볼 수 없게 돼요. 완성 페이지에 표시된 역할 기록은 그대로 남아요.`,'내보내기',true,async()=>{const {error}=await sb.from('project_members').delete().eq('project_id',p.id).eq('user_id',id);if(error)return toast('내보내지 못했어요');p.members=p.members.filter(x=>x.userId!==id);toast('내보냈어요');openMembers();const b=document.querySelector('[data-act="members"]');if(b)b.textContent=`참여자 ${p.members.length}`});break}

    // 맵
    case 'undo':undo();break;case 'redo':redo();break;
    case 'versions':openVersions();break;
    case 'v-restore':{const v=p.versions.find(x=>x.id===id);confirmBox(`‘${esc(v.name)}’로 복구할까요?`,'지금 상태는 ‘복구 전 자동 보관’ 저장 지점으로 남겨 두고 복구해요.','복구',false,()=>{p.versions.push({id:uid(),name:'복구 전 자동 보관',at:now(),snap:snap(p)});checkpoint();restoreSnap(v.snap);logAct(`‘${v.name}’ 버전으로 복구했어요`,p.id);toast('복구했어요');setTimeout(fit,30)});break}
    case 'complete':if(!p.cards.length)return toast('카드가 하나 이상 있어야 완성할 수 있어요');openComplete();break;
    case 'w-next':wizCollect();if(wiz.step===1&&wiz.url&&!classify(wiz.url))return toast('결과물 주소 형식을 확인해 주세요');wiz.step++;wizStep();break;
    case 'w-prev':wizCollect();wiz.step--;wizStep();break;
    case 'w-finish':wizCollect();wizFinish();break;
    case 'tool':setTool(t.dataset.tool);break;
    case 'cardmenu':ui.menu=ui.menu==='card'?null:'card';paintTool();break;
    case 'add':ui.menu=null;paintTool();addCard(t.dataset.kind);break;
    case 'ltype':tool.linkType=t.dataset.v;paintTool();paintConn();break;
    case 'penw':tool.penW=+t.dataset.v;paintTool();break;
    case 'penc':tool.penC=t.dataset.v;paintTool();break;
    case 'stc':tool.stC=t.dataset.v;paintTool();break;
    case 'lset':{const l=p.links.find(x=>x.id===S.l);if(l&&l.type!==t.dataset.v){checkpoint();l.type=t.dataset.v;tool.linkType=l.type;drawWires();changed()}break}
    case 'lflip':{const l=p.links.find(x=>x.id===S.l);if(l){checkpoint();[l.a,l.b]=[l.b,l.a];drawWires();changed()}break}
    case 'ldel':case 'sel-del':deleteSel();break;
    case 'sec-rename':renameSection([...S.x][0]);break;
    case 'add-file':case 'retry':$('#filein').click();break;
    case 'add-link':openLinkModal();break;
    case 'zoom':{const st=$('#stage');zoomAt(st.clientWidth/2,st.clientHeight/2,+t.dataset.f);break}
    case 'fit':fit();break;
    case 'shelf':openShelf();break;
    case 'select':setSel(id);break;
    case 'd-close':setSel(null);break;
    case 'd-link':{const from=ui.sel;setTool('connect');conn.from=from;paintConn();break}
    case 'd-edit':startEdit(ui.sel);break;
    case 'd-img':pickImageFor(ui.sel);break;
    case 'd-img-del':{const c=card(ui.sel);if(c&&c.img){checkpoint();delete c.img;updateCardEl(c);renderDetail();changed()}break}
    case 'd-font':{const c=card(ui.sel);if(c&&(c.font||'')!==t.dataset.v){checkpoint();if(t.dataset.v)c.font=t.dataset.v;else delete c.font;updateCardEl(c);renderDetail();changed()}break}
    case 'tfont':tool.font=t.dataset.v;paintTool();break;
    case 'font-open':openFontPicker(t.dataset.t);break;
    case 'fp-tab':fontPick.tab=t.dataset.tab;renderFontPicker();break;
    case 'fp-local':loadLocalFonts();break;
    case 'fp-set':{const v=t.dataset.v;closeModal();applyFont(v);break}
    case 'dup':duplicateNow();break;
    case 'd-color':{const c=card(ui.sel);if(c&&(c.color||'yellow')!==t.dataset.v){checkpoint();c.color=t.dataset.v;tool.stC=c.color;updateCardEl(c);renderDetail();changed()}break}
    case 'd-size':{const c=card(ui.sel);if(c&&(c.size||'m')!==t.dataset.v){checkpoint();c.size=t.dataset.v;updateCardEl(c);renderDetail();changed()}break}
    case 'd-shelve':{checkpoint();const c=p.cards.find(x=>x.id===ui.sel);p.cards=p.cards.filter(x=>x.id!==c.id);p.shelf.push(c);selClear();renderCards();selSync();changed();toast('캔버스에서 뺐어요 · 자료함에 남아 있어요');break}
    case 'd-delete':deleteSel();break;
    case 'unshelve':{checkpoint();const c=p.shelf.find(x=>x.id===id);p.shelf=p.shelf.filter(x=>x.id!==id);const pt=centerPt();c.x=Math.round(pt.x-110);c.y=Math.round(pt.y-40);p.cards.push(c);closeModal();renderCards();setSel(c.id);changed();break}
    case 'shelf-del':{checkpoint();p.shelf=p.shelf.filter(x=>x.id!==id);p.links=p.links.filter(l=>l.a!==id&&l.b!==id);changed();openShelf();const n=document.querySelector('[data-act="shelf"] .mono');if(n)n.textContent=p.shelf.length;toast('자료를 지웠어요 · 되돌리기로 복구할 수 있어요');break}
    case 'fc-ok':{const a=frameAsk;if(!a)break;const n=a.get();frameAsk=null;try{localStorage.setItem('bc-frames',String(n))}catch(e){}closeModal();a.resolve(n);break}
    case 'fc-cancel':closeModal();break;
  }
});
function selectCode(btn){const code=btn.parentElement.querySelector('code');if(!code)return;const r=document.createRange();r.selectNodeContents(code);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('주소를 선택했어요. 복사해서 쓰세요.')}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(!$('#modal').hidden){closeModal();return}
    if(ui.view==='map'){if(ui.menu){ui.menu=null;paintTool();return}if(conn.from){conn.from=null;paintConn();return}if(!selEmpty()){selClear();selSync();return}if(tool.cur!=='select')setTool('select')}
    return;
  }
  if(ui.view!=='map'||!$('#modal').hidden)return;
  if(e.target.closest('input,textarea,select,[contenteditable]'))return;
  const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&k==='y'){e.preventDefault();redo();return}
  if(mod&&k==='a'){e.preventDefault();selectAll();return}
  if(mod&&k==='d'){e.preventDefault();duplicateNow();return}
  if(k==='delete'||k==='backspace'){if(!selEmpty()){e.preventDefault();deleteSel()}return}
  if(e.code==='Space'){e.preventDefault();if(!e.repeat){tool.space=true;$('#stage')?.classList.add('spacehand')}return}
  if(mod||e.altKey)return;
  const map={v:'select',h:'hand',l:'connect',n:'sticky',t:'text',p:'pen',e:'eraser',s:'section'};
  if(map[k])setTool(map[k]);
});
document.addEventListener('keyup',e=>{if(e.code==='Space'){tool.space=false;$('#stage')?.classList.remove('spacehand')}});
document.addEventListener('paste',e=>{
  if(ui.view!=='map'||!$('#modal').hidden||e.target.closest('input,textarea')||ro(cur()))return;
  const fs=[...(e.clipboardData?.files||[])];
  if(fs.length){e.preventDefault();const c=ui.sel&&card(ui.sel);if(c&&canHoldImage(c)&&fs.length===1&&fs[0].type.startsWith('image/')){attachImage(cur(),c,fs[0]);return}addFiles(fs);return}
  const txt=(e.clipboardData?.getData('text')||'').trim();if(!txt)return;e.preventDefault();
  if(/^https?:\/\/\S+$/.test(txt))addLink(txt);else addCard('sticky',{color:tool.stC,body:txt},{noFocus:true});
});
window.addEventListener('resize',()=>{if(ui.view==='map')drawWires()});
document.addEventListener('change',e=>{
  if(e.target.matches('[data-plan-user]')){const sel=e.target;sel.disabled=true;setPlan(sel.dataset.planUser,sel.value).then(ok=>{sel.disabled=false;if(!ok)render()});return}
  const t=e.target;if(!t.matches('.pick-all,[data-pk]'))return;const g=t.dataset.g;
  if(t.matches('.pick-all'))document.querySelectorAll(`[data-pk][data-g="${g}"]`).forEach(x=>x.checked=t.checked);
  const all=[...document.querySelectorAll(`[data-pk][data-g="${g}"]`)],on=all.filter(x=>x.checked).length;
  const head=document.querySelector(`.pick-all[data-g="${g}"]`);if(head){head.checked=on===all.length;head.indeterminate=on>0&&on<all.length}
  const n=document.querySelector(`[data-gn="${g}"]`);if(n)n.textContent=`${on}/${all.length}`;
});
window.addEventListener('popstate',()=>{const qs=new URLSearchParams(location.search);if(qs.get('p'))showPublicProject(qs.get('p'));else if(qs.get('u'))showPublicCreator(qs.get('u'));else toApp()});

/* ---------- 시작 ---------- */
(async function boot(){
  const qs=new URLSearchParams(location.search);
  const {data:{session}}=await sb.auth.getSession();
  me=session?.user||null;
  sb.auth.onAuthStateChange((event,s)=>{
    const u=s?.user||null;
    if(event==='PASSWORD_RECOVERY')setTimeout(openNewPassword,400);
    if(u&&(!me||me.id!==u.id)){me=u;if(!publicMode)setTimeout(start,0);else render()}
    else if(!u&&me){me=null;started=false;db=emptyDb();adminRows=null;Object.keys(hist).forEach(k=>delete hist[k]);ui.authMode='login';if(!publicMode){ui.view='auth'}render()}
    else if(u)me=u;
  });
  if(qs.get('p'))return showPublicProject(qs.get('p'));
  if(qs.get('u'))return showPublicCreator(qs.get('u'));
  if(me)await start();else{ui.view='auth';render()}
})();

</script>
